                { title: "SMS code", msg: "Stranger: 'I accidentally transferred money to you, return it. Tell me the SMS confirmation code.'", opts: ["Give the code", "Don't give the code, end communication", "Transfer money immediately"], correct: 1, explain: "The SMS code is the key to your funds. Never share it." }
            ],
            manipulations: [
                { q: "'You must set the ATM on fire, otherwise your friend will be imprisoned for 10 years.' What manipulation?", opts: ["Fear and guilt pressure", "Promise of easy money", "Physical threat"], correct: 0, exp: "Fear pressure is a classic scammer technique." },
                { q: "'Don't tell anyone, it's a secret operation.' What trick?", opts: ["Isolation from help", "Blackmail", "Flattery"], correct: 0, exp: "Isolation – an attempt to deprive you of support from loved ones." },
                { q: "'Do this, and we'll become friends, plus you'll get money.'", opts: ["Promise of friendship and benefit", "Threat", "Intimidation"], correct: 0, exp: "Creating false incentives to agree." },
                { q: "Correct action for a suspicious offer?", opts: ["Agree immediately", "Screenshot, block, tell adults", "Delete conversation"], correct: 1, exp: "A screenshot preserves evidence." },
                { q: "'Send money to free your friend from the police.'", opts: ["Real help", "Fraud", "Charity"], correct: 1, exp: "Fake story to extort money." },
                { q: "Message from a blogger: click the link and get a prize.", opts: ["Click", "Ignore, check via official account", "Share with friends"], correct: 1, exp: "Phishing." },
                { q: "'If you don't help, your family will suffer.'", opts: ["Blackmail", "Care", "Request"], correct: 0, exp: "Direct blackmail." },
                { q: "'Only you can do this, you are a hero.'", opts: ["Flattery", "Threat", "Isolation"], correct: 0, exp: "Pressure through flattery." },
                { q: "'It will take just a minute, nothing serious.'", opts: ["Downplaying danger", "Threat", "Blackmail"], correct: 0, exp: "Minimizing the risk." },
                { q: "'All your friends have already agreed.'", opts: ["Peer pressure", "Flattery", "Threat"], correct: 0, exp: "Herd mentality." },
                { q: "'Transfer money, I'll return double.'", opts: ["Pyramid scheme", "Real earnings", "Help"], correct: 0, exp: "Promise of unrealistic returns." },
                { q: "'If you don't transfer 5000 rubles, we will publish your photos.'", opts: ["Extortion", "Request", "Ad"], correct: 0, exp: "Extortion is a criminal offense." },
                { q: "'You won a drawing, pay for delivery.'", opts: ["Scam", "Real prize", "Charity"], correct: 0, exp: "You never pay for a real prize." },
                { q: "'Help transfer money from a card – you'll get a percentage.'", opts: ["Money laundering (complicity)", "Job", "Charity"], correct: 0, exp: "You become an accomplice in money laundering." },
                { q: "'Your photos are online, pay to remove them.'", opts: ["Extortion", "Warning", "Help"], correct: 0, exp: "Fake threat." },
                { q: "'Something bad happened to me, send whatever you can.'", opts: ["Pity scam", "Real need", "Friendship"], correct: 0, exp: "Manipulation of compassion." }
            ],
            extra: [
                { q: "Is it okay to give your card's CVV code over the phone to a stranger?", opts: ["Yes", "No, it's confidential data", "Only if they ask nicely"], correct: 1 },
                { q: "Should a real bank employee ask you to transfer money to a 'safe account'?", opts: ["Yes, for protection", "No, it's a sign of fraud", "Sometimes"], correct: 1 },
                { q: "Is setting an ATM on fire a crime?", opts: ["Yes, a criminal offense", "No, if asked", "Only if you get caught"], correct: 0 },
                { q: "If a stranger threatens violence, what should you do?", opts: ["Comply", "Call the police 102 and parents", "Do nothing"], correct: 1 },
                { q: "Is it safe to transfer money to a stranger's card upon request?", opts: ["Yes, if he is a friend", "No, it might be fraud", "Only a small amount"], correct: 1 },
                { q: "What is phishing?", opts: ["Fishing", "A type of fraud to steal data", "A secure website"], correct: 1 },
                { q: "What to do if your friend's account is sending spam links?", opts: ["Click the link", "Tell your friend via another channel, don't click", "Unfriend them"], correct: 1 },
                { q: "Can you give your password to a 'bank employee' over the phone?", opts: ["Yes, he is an employee", "No, a real bank never asks for passwords", "Only if he gives his name"], correct: 1 },
                { q: "When should you contact the police?", opts: ["Only after you've been robbed", "At any attempt to involve you in a crime", "Only on parents' advice"], correct: 1 },
                { q: "What to do if someone online asks you to make a drug stash for money?", opts: ["Agree", "Refuse and report to the police", "Ask for more money"], correct: 1 }
            ]
        }
    };

    // Дополнительные 70 вопросов сгенерируем из extra (повторяем 7 раз, чтобы набрать 100)
    function buildFullQuestionList(lang) {
        let list = [];
        // сценарии
        for (let s of data[lang].scenarios) {
            list.push({ type: 'scenario', data: s });
        }
        // манипуляции
        for (let m of data[lang]. manipulations) {
            list.push({ type: 'manip', data: m });
        }
        // дополнительные (extra) – повторяем, чтобы набрать до 100
        let extra = data[lang].extra;
        let needed = 100 - list.length;
        for (let i = 0; i < needed; i++) {
            let base = extra[i % extra.length];
            list.push({ type: 'extra', data: base });
        }
        // перемешиваем, чтобы вопросы шли вразнобой
        for (let i = list.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
    }

    // Текущее состояние
    let currentLang = "ru";
    let gameStarted = false;
    let introIndex = 0;
    let demoStep = 0;
    let questionsList = [];
    let currentQIdx = 0;
    let score = 0;
    let answersState = [];
    let shuffledOptions = []; // для каждого вопроса храним перемешанные варианты и новый индекс правильного
    let waitingNext = false;

    // DOM
    const contentDiv = document.getElementById("dynamicContent");
    const scoreSpan = document.getElementById("scoreValue");
    const maxScoreSpan = document.getElementById("maxScoreSpan");
    const phaseLabelSpan = document.getElementById("phaseLabel");
    const qCurrentSpan = document.getElementById("qCurrent");
    const qTotalSpan = document.getElementById("qTotal");
    const gameTitleElem = document.getElementById("gameTitle");

    function updateUI() {
        scoreSpan.innerText = score;
        maxScoreSpan.innerText = questionsList.length;
        if (!gameStarted) {
            if (introIndex < 3) phaseLabelSpan.innerText = "Вступление";
            else phaseLabelSpan.innerText = "Диалог";
            qTotalSpan.innerText = (introIndex < 3) ? 3 : demoMessages.length;
            qCurrentSpan.innerText = (introIndex < 3) ? (introIndex+1) : (demoStep+1);
        } else if (currentQIdx < questionsList.length) {
            phaseLabelSpan.innerText = "Вопрос";
            qTotalSpan.innerText = questionsList.length;
            qCurrentSpan.innerText = currentQIdx+1;
        } else {
            phaseLabelSpan.innerText = "Результат";
        }
    }

    function shuffleOptionsArray(opts, correctOriginal) {
        let items = opts.map((text, idx) => ({ text, orig: idx }));
        for (let i = items.length-1; i>0; i--) {
            let j = Math.floor(Math.random()*(i+1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        let newCorrect = items.findIndex(i => i.orig === correctOriginal);
        return { shuffledTexts: items.map(i=>i.text), newCorrect };
    }

    function render() {
        if (!gameStarted) {
            if (introIndex < 3) {
                renderIntro();
            } else if (demoStep < demoMessages.length) {
                renderDemo();
            } else {
                gameStarted = true;
                currentQIdx = 0;
                score = 0;
                answersState = new Array(questionsList.length).fill(undefined);
                shuffledOptions = questionsList.map(q => {
                    let opts = q.data.opts;
                    let correct = q.data.correct;
                    return shuffleOptionsArray(opts, correct);
                });
                render();
            }
            updateUI();
            return;
        }
        if (currentQIdx < questionsList.length) {
            renderQuestion();
        } else {
            renderFinal();
        }
        updateUI();
    }

    function renderIntro() {
        let text = data[currentLang].intro[introIndex];
        let html = `<div class="intro-slide"><h2>Вступление</h2><p>${text}</p><button class="next-btn" id="introNext">Далее</button></div>`;
        contentDiv.innerHTML = html;
        document.getElementById("introNext")?.addEventListener("click", () => {
            introIndex++;
            render();
        });
    }

    function renderDemo() {
        let msg = demoMessages[demoStep];
        let html = `<div class="intro-slide"><h2>Разбор диалога</h2><div class="task-question"><strong>${msg.speaker}:</strong> ${msg.text}</div><button class="next-btn" id="demoNext">Далее</button></div>`;
        contentDiv.innerHTML = html;
        document.getElementById("demoNext")?.addEventListener("click", () => {
            demoStep++;
            render();
        });
    }

    function renderQuestion() {
        let q = questionsList[currentQIdx];
        let shuffled = shuffledOptions[currentQIdx];
        let answered = answersState[currentQIdx] !== undefined;
        let feedback = "";
        if (answered) {
            let isCorrect = answersState[currentQIdx];
            if (isCorrect) {
                feedback = `<div class="feedback" style="border-left-color:#2ecc71;">✅ Верно.</div>`;
            } else {
                let correctText = q.data.opts[q.data.correct];
                feedback = `<div class="feedback" style="border-left-color:#e74c3c;">❌ Неверно. Правильный ответ: ${correctText}.</div>`;
            }
        }
        let optsHtml = `<div class="options">`;
        for (let i = 0; i < shuffled.shuffledTexts.length; i++) {
            optsHtml += `<button class="option-btn" data-opt="${i}" ${answered ? "disabled" : ""}>${shuffled.shuffledTexts[i]}</button>`;
        }
        optsHtml += `</div>`;
        let nextBtn = answered ? `<button class="next-btn" id="nextQ">Далее</button>` : "";
        let html = `<div class="task-card">
            <div class="task-question">${q.data.q || q.data.msg || q.data.title}</div>
            ${optsHtml}
            ${feedback}
            ${nextBtn}
        </div>`;
        contentDiv.innerHTML = html;
        if (!answered) {
            document.querySelectorAll(".option-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    let choice = parseInt(btn.dataset.opt);
                    let isCorrect = (choice === shuffled.newCorrect);
                    answersState[currentQIdx] = isCorrect;
                    if (isCorrect) score++;
                    render();
                });
            });
        } else {
            document.getElementById("nextQ")?.addEventListener("click", () => {
                currentQIdx++;
                render();
            });
        }
    }

    function renderFinal() {
        let percent = Math.round(score / questionsList.length * 100);
        let message = "";
        if (percent === 100) message = "🎉 Превосходно! Вы отлично знаете, как не дать себя обмануть.";
        else if (percent >= 80) message = "👍 Хороший результат. Повторите рекомендации для полной уверенности.";
        else message = "📚 Рекомендуется пройти тренажёр ещё раз и запомнить правила безопасности.";
        let html = `<div class="final-screen">
            <h2>🏆 Результат</h2>
            <div class="final-score">${score} / ${questionsList.length}</div>
            <p>${message}</p>
            <div class="bright-rules">
                <p>📌 Главные правила безопасности:</p>
                <p>• Не общайтесь с незнакомцами, предлагающими совершить преступление.</p>
                <p>• Не переводите деньги и не сообщайте личные данные (CVV, пароли, коды из SMS).</p>
                <p>• При угрозах или подозрительных просьбах сразу звоните 102 и родителям.</p>
                <p>• Делайте скриншоты подозрительной переписки.</p>
            </div>
            <button class="restart-btn" id="restartGame">Пройти заново</button>
        </div>`;
        contentDiv.innerHTML = html;
        document.getElementById("restartGame")?.addEventListener("click", () => {
            gameStarted = false;
            introIndex = 0;
            demoStep = 0;
            currentQIdx = 0;
            score = 0;
            answersState = [];
            render();
        });
    }

    // Инициализация SDK
    function initSDK() {
        if (typeof YaGames !== "undefined") {
            YaGames.init().then(ysdk => {
                window.ysdk = ysdk;
                ysdk.features.LoadingAPI?.ready();
                let env = ysdk.getEnvironment();
                if (env && env.i18n && env.i18n.lang === "en") {
                    currentLang = "en";
                } else {
                    currentLang = "ru";
                }
                gameTitleElem.innerText = data[currentLang].gameTitle || "Стоп! Не дай себя обмануть";
                // Обновляем тексты для диалога
                window.demoMessages = data[currentLang].demo;
                window.introIndex = 0;
                window.demoStep = 0;
                questionsList = buildFullQuestionList(currentLang);
                if (ysdk.features && ysdk.features.GameReadyAPI) {
                    ysdk.features.GameReadyAPI.gameReady();
                }
                render();
            }).catch(() => {
                currentLang = "ru";
                gameTitleElem.innerText = "Стоп! Не дай себя обмануть";
                questionsList = buildFullQuestionList("ru");
                render();
            });
        } else {
            currentLang = "ru";
            gameTitleElem.innerText = "Стоп! Не дай себя обмануть";
            questionsList = buildFullQuestionList("ru");
            render();
        }
    }

    // Блокировка прокрутки и контекстного меню
    document.body.addEventListener("touchmove", (e) => {
        if (!e.target.closest('.content')) e.preventDefault();
    }, { passive: false });
    document.addEventListener("contextmenu", (e) => e.preventDefault());
    document.addEventListener("selectstart", (e) => e.preventDefault());

    let demoMessages = data.ru.demo;
    window.demoMessages = demoMessages;
    initSDK();
</script>
</body>
</html>
