<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Части суток | найди пару</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #aad4cf;
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Arial', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            max-width: 650px;
            width: 100%;
            background: #fffef7;
            border-radius: 52px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.1);
            padding: 20px 16px 24px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #2a6b47;
            margin-bottom: 6px;
        }
        .sub {
            text-align: center;
            font-size: 0.85rem;
            background: #fef3da;
            display: inline-block;
            width: 100%;
            padding: 6px;
            border-radius: 60px;
            color: #5a7a6a;
            margin-bottom: 16px;
        }
        /* Сетка 2x2 для мобильных */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 15px 0 20px;
        }
        .card {
            background: #fff9ef;
            border-radius: 40px;
            padding: 14px 8px;
            text-align: center;
            box-shadow: 0 6px 0 #ddcca8;
            border: 2px solid #ffda9e;
        }
        .card-img {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }
        /* зона сброса (без подписи, только пустое место) */
        .drop-zone {
            background: #eef3e0;
            border-radius: 50px;
            padding: 12px 8px;
            min-height: 68px;
            border: 2px dashed #7fa87f;
            transition: 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .drop-zone.filled {
            background: #cfe6cf;
            border-color: #2a6b47;
        }
        .placed-word {
            background: #b0d9b1;
            color: #1e5a2a;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 1.1rem;
        }
        .words-pool {
            background: #fff3e0;
            border-radius: 50px;
            padding: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
        }
        .word-btn {
            background: #ffaa44;
            border: none;
            font-weight: bold;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #b97f2e;
            transition: 0.05s linear;
            color: #2d2b1f;
        }
        .word-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b97f2e;
        }
        .word-btn.selected {
            background: #f4a261;
            box-shadow: 0 0 0 2px #2a6b47;
        }
        .word-btn.disabled-word {
            background: #c0c0a0;
            box-shadow: none;
            cursor: default;
            opacity: 0.6;
            transform: none;
        }
        .reset-btn {
            background: #7fa87f;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            color: white;
            margin-top: 20px;
        }
        .message {
            text-align: center;
            margin-top: 16px;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px;
            border-radius: 40px;
        }
        .success {
            background: #d9f0da;
            color: #1e5a2a;
        }
        .error {
            background: #ffe0e0;
            color: #a1131e;
        }
        .copyright {
            text-align: center;
            font-size: 0.65rem;
            margin-top: 20px;
            color: #aac7be;
        }
        @media (max-width: 550px) {
            .card-img { font-size: 2.8rem; }
            .word-btn { font-size: 1rem; padding: 8px 18px; }
            .drop-zone { min-height: 60px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🌞 Части суток</h1>
    <div class="sub">нажми слово → нажми на пустое место под картинкой</div>

    <div class="grid">
        <div class="card" data-part="утро">
            <div class="card-img">🌅</div>
            <div class="drop-zone" data-part="утро" id="drop-утро"></div>
        </div>
        <div class="card" data-part="день">
            <div class="card-img">☀️</div>
            <div class="drop-zone" data-part="день" id="drop-день"></div>
        </div>
        <div class="card" data-part="вечер">
            <div class="card-img">🌇</div>
            <div class="drop-zone" data-part="вечер" id="drop-вечер"></div>
        </div>
        <div class="card" data-part="ночь">
            <div class="card-img">🌙✨</div>
            <div class="drop-zone" data-part="ночь" id="drop-ночь"></div>
        </div>
    </div>

    <div class="words-pool" id="wordsPool">
        <button class="word-btn" data-word="утро">утро</button>
        <button class="word-btn" data-word="день">день</button>
        <button class="word-btn" data-word="вечер">вечер</button>
        <button class="word-btn" data-word="ночь">ночь</button>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 Начать заново</button>
    <div id="messageArea" class="message"></div>
    <div class="copyright">окружающий мир · 1 класс</div>
</div>

<script>
    // Состояние: какая часть суток какое слово получила
    let assignments = {
        утро: null,
        день: null,
        вечер: null,
        ночь: null
    };
    let selectedWord = null;

    const dropZones = {
        утро: document.getElementById('drop-утро'),
        день: document.getElementById('drop-день'),
        вечер: document.getElementById('drop-вечер'),
        ночь: document.getElementById('drop-ночь')
    };
    const wordBtns = document.querySelectorAll('.word-btn');
    const resetBtn = document.getElementById('resetBtn');
    const messageDiv = document.getElementById('messageArea');

    function updateZones() {
        for (let part in dropZones) {
            const zoneDiv = dropZones[part];
            zoneDiv.innerHTML = '';
            const word = assignments[part];
            if (word) {
                zoneDiv.classList.add('filled');
                const span = document.createElement('span');
                span.className = 'placed-word';
                span.innerText = word;
                zoneDiv.appendChild(span);
            } else {
                zoneDiv.classList.remove('filled');
            }
        }
    }

    function updateButtons() {
        const usedWords = Object.values(assignments).filter(v => v !== null);
        wordBtns.forEach(btn => {
            const word = btn.getAttribute('data-word');
            if (usedWords.includes(word)) {
                btn.disabled = true;
                btn.classList.add('disabled-word');
            } else {
                btn.disabled = false;
                btn.classList.remove('disabled-word');
            }
        });
        // сбрасываем выделение, если выбранное слово уже использовано
        if (selectedWord && usedWords.includes(selectedWord)) {
            clearSelected();
        }
    }

    function clearSelected() {
        if (selectedWord) {
            document.querySelectorAll('.word-btn').forEach(btn => btn.classList.remove('selected'));
            selectedWord = null;
        }
    }

    function checkCompletion() {
        const allFilled = assignments.утро && assignments.день && assignments.вечер && assignments.ночь;
        if (!allFilled) {
            messageDiv.innerHTML = '';
            messageDiv.className = 'message';
            return;
        }
        const correct = (assignments.утро === 'утро' && assignments.день === 'день' && assignments.вечер === 'вечер' && assignments.ночь === 'ночь');
        if (correct) {
            messageDiv.innerHTML = '🎉 Молодец! Все слова подобраны верно! 🎉';
            messageDiv.className = 'message success';
        } else {
            messageDiv.innerHTML = '❌ Некоторые слова перепутаны. Нажми «Начать заново» и попробуй ещё раз.';
            messageDiv.className = 'message error';
        }
    }

    function onZoneClick(part) {
        if (assignments[part] !== null) return; // уже занято
        if (!selectedWord) {
            messageDiv.innerHTML = 'Сначала нажми на слово внизу, затем на пустое место под картинкой.';
            messageDiv.className = 'message error';
            setTimeout(() => {
                if (messageDiv.innerHTML === 'Сначала нажми на слово внизу, затем на пустое место под картинкой.') messageDiv.innerHTML = '';
            }, 1800);
            return;
        }
        // кладём слово
        assignments[part] = selectedWord;
        updateZones();
        updateButtons();
        clearSelected();       // сбросить выделение слова
        checkCompletion();
        // убираем подсказку
        if (messageDiv.classList.contains('error') && messageDiv.innerHTML.includes('Сначала нажми')) messageDiv.innerHTML = '';
    }

    function resetGame() {
        assignments = { утро: null, день: null, вечер: null, ночь: null };
        selectedWord = null;
        updateZones();
        updateButtons();
        messageDiv.innerHTML = '';
        messageDiv.className = 'message';
    }

    function initWordButtons() {
        wordBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (btn.disabled) return;
                // снимаем выделение со всех
                document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedWord = btn.getAttribute('data-word');
                if (messageDiv.classList.contains('error')) messageDiv.innerHTML = '';
            });
        });
    }

    function initZones() {
        for (let part in dropZones) {
            const zone = dropZones[part];
            zone.addEventListener('click', (e) => {
                e.stopPropagation();
                // если кликнули на уже размещённое слово – ничего не делаем
                if (e.target.closest('.placed-word')) return;
                onZoneClick(part);
            });
        }
    }

    resetBtn.addEventListener('click', resetGame);
    initWordButtons();
    initZones();
    updateZones();
    updateButtons();
</script>
</body>
</html>
