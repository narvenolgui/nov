<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Части суток | перетащи слово</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #aad4cf;
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #fffef7;
            border-radius: 64px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.15);
            padding: 25px;
        }
        h1 {
            text-align: center;
            color: #2a6b47;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .sub {
            text-align: center;
            color: #5a7a6a;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        /* Сетка с картинками */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }
        .card {
            background: #fff9ef;
            border-radius: 48px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 8px 0 #ddcca8;
            border: 2px solid #ffda9e;
            transition: 0.1s;
        }
        .card-img {
            font-size: 5rem;
            margin-bottom: 15px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: #b45f1b;
            margin-top: 5px;
            background: #fef3da;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 40px;
        }
        .drop-zone {
            margin-top: 15px;
            background: #eef3e0;
            border-radius: 60px;
            padding: 15px 10px;
            min-height: 80px;
            border: 2px dashed #7fa87f;
            transition: 0.1s;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .drop-zone.drag-over {
            background: #cfe6cf;
            border-color: #2a6b47;
        }
        .word-tag {
            background: #ffaa44;
            color: #2d2b1f;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            display: inline-block;
            font-size: 1.2rem;
            box-shadow: 0 3px 0 #b97f2e;
            cursor: grab;
            transition: 0.05s linear;
            user-select: none;
        }
        .word-tag:active {
            cursor: grabbing;
        }
        .word-tag.dragging {
            opacity: 0.4;
        }
        .words-pool {
            background: #fff3e0;
            border-radius: 60px;
            padding: 20px;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .reset-btn {
            background: #7fa87f;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            color: white;
            margin-top: 20px;
            font-family: inherit;
            transition: 0.1s;
        }
        .reset-btn:active {
            transform: scale(0.97);
        }
        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 10px;
            border-radius: 40px;
        }
        .success {
            background: #d9f0da;
            color: #1e5a2a;
        }
        .copyright {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 25px;
            color: #aac7be;
        }
        @media (max-width: 700px) {
            .card-img { font-size: 3.5rem; }
            .word-tag { font-size: 1rem; padding: 6px 14px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🌞 Части суток</h1>
    <div class="sub">Перетащи слово подходящей картинке</div>

    <div class="grid" id="cardsGrid">
        <!-- карточка утро -->
        <div class="card" data-part="утро">
            <div class="card-img">🌅</div>
            <div class="card-title">УТРО</div>
            <div class="drop-zone" id="drop-утро"></div>
        </div>
        <!-- карточка день -->
        <div class="card" data-part="день">
            <div class="card-img">☀️</div>
            <div class="card-title">ДЕНЬ</div>
            <div class="drop-zone" id="drop-день"></div>
        </div>
        <!-- карточка вечер -->
        <div class="card" data-part="вечер">
            <div class="card-img">🌇</div>
            <div class="card-title">ВЕЧЕР</div>
            <div class="drop-zone" id="drop-вечер"></div>
        </div>
        <!-- карточка ночь -->
        <div class="card" data-part="ночь">
            <div class="card-img">🌙✨</div>
            <div class="card-title">НОЧЬ</div>
            <div class="drop-zone" id="drop-ночь"></div>
        </div>
    </div>

    <!-- Область слов для перетаскивания -->
    <div class="words-pool" id="wordsPool">
        <div class="word-tag" draggable="true" data-word="утро">утро</div>
        <div class="word-tag" draggable="true" data-word="день">день</div>
        <div class="word-tag" draggable="true" data-word="вечер">вечер</div>
        <div class="word-tag" draggable="true" data-word="ночь">ночь</div>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 Начать заново</button>
    <div id="messageArea" class="message"></div>
    <div class="copyright">
        интерактивное задание · окружающий мир
    </div>
</div>

<script>
    // Игра "перетащи слово к картинке" – части суток
    // Правильные соответствия: утро → утро, день → день, вечер → вечер, ночь → ночь
    // Хранение состояния: какая зона какое слово приняла
    let assignments = {
        утро: null,
        день: null,
        вечер: null,
        ночь: null
    };

    const dropZones = {
        утро: document.getElementById('drop-утро'),
        день: document.getElementById('drop-день'),
        вечер: document.getElementById('drop-вечер'),
        ночь: document.getElementById('drop-ночь')
    };
    const wordsPoolDiv = document.getElementById('wordsPool');
    let wordsList = []; // массив { element, word }

    // Проверка, все ли слова расставлены
    function checkComplete() {
        const allAssigned = assignments.утро !== null && assignments.день !== null && assignments.вечер !== null && assignments.ночь !== null;
        const messageDiv = document.getElementById('messageArea');
        if (allAssigned) {
            let correct = true;
            if (assignments.утро !== 'утро') correct = false;
            if (assignments.день !== 'день') correct = false;
            if (assignments.вечер !== 'вечер') correct = false;
            if (assignments.ночь !== 'ночь') correct = false;
            if (correct) {
                messageDiv.innerHTML = '🎉 Молодец! Все слова на своих местах! 🎉';
                messageDiv.className = 'message success';
            } else {
                messageDiv.innerHTML = '❌ Некоторые слова перепутаны. Нажми «Начать заново» и попробуй ещё раз.';
                messageDiv.className = 'message';
                messageDiv.style.background = '#ffe0e0';
                messageDiv.style.color = '#a1131e';
            }
        } else {
            messageDiv.innerHTML = '';
            messageDiv.className = 'message';
        }
    }

    // Обновить отображение в drop-зонах
    function renderDropZones() {
        for (let part in dropZones) {
            const zone = dropZones[part];
            zone.innerHTML = '';
            const word = assignments[part];
            if (word) {
                const tag = document.createElement('div');
                tag.className = 'word-tag';
                tag.style.background = '#b0d9b1';
                tag.style.boxShadow = 'none';
                tag.style.cursor = 'default';
                tag.innerText = word;
                zone.appendChild(tag);
            }
        }
    }

    // Обновить видимость неиспользованных слов (скрыть те, что уже куда-то привязаны)
    function updateWordsPool() {
        const usedWords = Object.values(assignments).filter(v => v !== null);
        for (let w of wordsList) {
            if (usedWords.includes(w.word)) {
                w.element.style.display = 'none';
                w.element.setAttribute('draggable', 'false');
            } else {
                w.element.style.display = 'inline-block';
                w.element.setAttribute('draggable', 'true');
            }
        }
    }

    // Сброс игры
    function resetGame() {
        assignments = {
            утро: null,
            день: null,
            вечер: null,
            ночь: null
        };
        renderDropZones();
        updateWordsPool();
        const messageDiv = document.getElementById('messageArea');
        messageDiv.innerHTML = '';
        messageDiv.className = 'message';
    }

    // Перетаскивание: dragstart
    function onDragStart(e) {
        const target = e.target.closest('.word-tag');
        if (!target) return;
        if (target.getAttribute('draggable') === 'false') {
            e.preventDefault();
            return false;
        }
        const word = target.getAttribute('data-word');
        e.dataTransfer.setData('text/plain', word);
        e.dataTransfer.effectAllowed = 'copy';
        target.classList.add('dragging');
        setTimeout(() => target.classList.remove('dragging'), 0);
    }

    // drag over
    function onDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        const dropZone = e.target.closest('.drop-zone');
        if (dropZone) {
            dropZone.classList.add('drag-over');
        }
    }

    function onDragLeave(e) {
        const dropZone = e.target.closest('.drop-zone');
        if (dropZone) {
            dropZone.classList.remove('drag-over');
        }
    }

    // drop
    function onDrop(e) {
        e.preventDefault();
        const dropZone = e.target.closest('.drop-zone');
        if (!dropZone) return;
        dropZone.classList.remove('drag-over');
        // Определим, для какой части суток эта зона
        let targetPart = null;
        for (let part in dropZones) {
            if (dropZones[part] === dropZone) {
                targetPart = part;
                break;
            }
        }
        if (!targetPart) return;
        const word = e.dataTransfer.getData('text/plain');
        if (!word) return;
        // Проверяем, что слово не использовано
        const used = Object.values(assignments).some(v => v === word);
        if (used) return; // слово уже используется
        // Присваиваем
        assignments[targetPart] = word;
        renderDropZones();
        updateWordsPool();
        checkComplete();
    }

    // Инициализация
    function init() {
        // собираем элементы слов
        const wordElements = document.querySelectorAll('#wordsPool .word-tag');
        wordsList = [];
        wordElements.forEach(el => {
            const word = el.getAttribute('data-word');
            wordsList.push({ element: el, word: word });
            // вешаем обработчики перетаскивания
            el.addEventListener('dragstart', onDragStart);
            el.addEventListener('dragend', (e) => {
                e.target.classList.remove('dragging');
            });
        });
        // добавляем обработчики для зон сброса
        for (let part in dropZones) {
            const zone = dropZones[part];
            zone.addEventListener('dragover', onDragOver);
            zone.addEventListener('dragleave', onDragLeave);
            zone.addEventListener('drop', onDrop);
        }
        // кнопка сброса
        const resetBtn = document.getElementById('resetBtn');
        resetBtn.addEventListener('click', resetGame);
        // начальный рендер
        renderDropZones();
        updateWordsPool();
        checkComplete();
    }

    init();
</script>
</body>
</html>
