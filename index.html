<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation, viewport-fit=cover">
    <title>Разрыв — вырвись из круга</title>
    <!-- SDK Яндекс Игр -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        #gameContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        canvas {
            display: block;
            border: 3px solid #e94560;
            border-radius: 20px;
            box-shadow: 0 0 30px #e94560;
            margin-top: 5px;
            max-width: 95%;
            max-height: 75vh;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 12px;
        }
        #bottomUI {
            width: 95%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 8px;
        }
        #restartBtn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 0 20px #ff4d6d;
            cursor: pointer;
            white-space: nowrap;
            display: none;
            margin: 5px 0;
        }
        #hint {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="bottomUI">
            <div id="hint">👈 Нажимай левее/правее, чтобы менять дорожку! Лови 👍 и уворачивайся</div>
            <button id="restartBtn">🔄 Начать заново</button>
        </div>
    </div>
    <div id="ui">
        <span>⭐ <span id="scoreDisplay">0</span></span>
        <span>❤️ <span id="livesDisplay">3</span></span>
        <span>📋 <span id="dilemmaCountDisplay">0/100</span></span>
    </div>

    <script>
        (function() {
            // ---------- ПЕРЕМЕННЫЕ ИГРЫ ----------
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const livesSpan = document.getElementById('livesDisplay');
            const dilemmaCountSpan = document.getElementById('dilemmaCountDisplay');
            const restartBtn = document.getElementById('restartBtn');
            const hintDiv = document.getElementById('hint');

            let ysdk = null;
            let playerLang = 'ru'; // по умолчанию русский
            let allDilemmas = []; // массив дилемм на нужном языке
            let dilemmaIndex = 0; // индекс текущей дилеммы
            const MAX_DILEMMAS = 100;
            let dilemmaResolvedCount = 0; // сколько дилемм решено всего

            // Адаптивный размер canvas
            function resizeCanvas() {
                const maxWidth = Math.min(window.innerWidth - 20, 400);
                const maxHeight = Math.min(window.innerHeight * 0.75, 750);
                canvas.width = maxWidth;
                canvas.height = maxHeight;
            }
            window.addEventListener('resize', () => {
                resizeCanvas();
                if (typeof colWidth !== 'undefined') {
                    colWidth = canvas.width / COL_COUNT;
                    playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                }
            });
            resizeCanvas();

            const COL_COUNT = 3;
            let colWidth = canvas.width / COL_COUNT;
            let playerCol = 1;
            const playerWidth = 40;
            const playerHeight = 60;
            let playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
            let playerY;

            let obstacles = [];
            let goodItems = [];
            let score = 0;
            let lives = 3;
            let gameSpeed = 5;
            let isGameOver = false;
            let dilemmaActive = false;
            let dilemmaData = null;
            let shieldActive = false;
            let shieldTimer = 0;
            let frameCount = 0;

            let dilemmaButtons = [];

            playerY = canvas.height - playerHeight - 20;

            // ---------- ЛОКАЛИЗАЦИЯ ----------
            const texts = {
                ru: {
                    hint: '👈 Нажимай левее/правее, чтобы менять дорожку! Лови 👍 и уворачивайся',
                    restart: '🔄 Начать заново',
                    gameOver: 'Группировка затянула...',
                    win: 'Ты вырвался! Поздравляем!',
                    score: 'Рейтинг',
                    lives: 'Жизни',
                    dilemmas: 'Дилеммы',
                    good: 'Верный шаг',
                    bad: 'Опасный путь'
                },
                en: {
                    hint: '👈 Tap left/right to change lane! Catch 👍 and dodge',
                    restart: '🔄 Restart',
                    gameOver: 'The group pulled you in...',
                    win: 'You broke free! Congratulations!',
                    score: 'Score',
                    lives: 'Lives',
                    dilemmas: 'Dilemmas',
                    good: 'Right choice',
                    bad: 'Dangerous path'
                }
            };
            let t = texts.ru;

            // Генератор 100+ дилемм на русском и английском
            function generateDilemmas(lang) {
                const baseRu = [
                    "Токсичный друг зовёт на опасный челлендж.",
                    "В соцсетях травят одноклассника.",
                    "Незнакомец предлагает лёгкие деньги за странное задание.",
                    "Группировка требует доказать верность.",
                    "Тебе предлагают попробовать сигареты за компанию.",
                    "Одноклассники зовут прогулять уроки.",
                    "В чате пишут гадости про учителя.",
                    "Друг просит списать на экзамене.",
                    "Предлагают украсть мелочь из магазина.",
                    "Зовут на вечеринку, где будет алкоголь."
                ];
                const baseEn = [
                    "A toxic friend invites you to a dangerous challenge.",
                    "A classmate is being bullied on social media.",
                    "A stranger offers easy money for a strange task.",
                    "The group demands proof of loyalty.",
                    "You are offered to try cigarettes for company.",
                    "Classmates invite you to skip classes.",
                    "Nasty things about the teacher are written in chat.",
                    "A friend asks to copy on an exam.",
                    "They offer to steal a small item from a store.",
                    "You are invited to a party where there will be alcohol."
                ];
                // Расширим до 100+ вариаций
                const dilemmas = [];
                const base = lang === 'ru' ? baseRu : baseEn;
                for (let i = 0; i < 110; i++) {
                    let template = base[i % base.length];
                    // Добавим вариативности: разные обстоятельства
                    if (i % 3 === 0) template += ' ' + (lang === 'ru' ? 'Что сделаешь?' : 'What will you do?');
                    else if (i % 3 === 1) template += ' ' + (lang === 'ru' ? 'Твой выбор?' : 'Your choice?');
                    else template += ' ' + (lang === 'ru' ? 'Как поступишь?' : 'How will you act?');
                    
                    dilemmas.push({
                        text: template,
                        good: {
                            label: lang === 'ru' ? 'Откажусь и расскажу родителям' : 'Refuse and tell parents',
                            points: 50,
                            shield: i % 2 === 0
                        },
                        bad: {
                            label: lang === 'ru' ? 'Соглашусь, чтобы не быть белой вороной' : 'Agree to not stand out',
                            points: -30,
                            shake: true
                        }
                    });
                }
                return dilemmas;
            }

            // Инициализация SDK
            async function initSDK() {
                try {
                    ysdk = await YaGames.init();
                    // Определение языка
                    const env = ysdk.environment;
                    const lang = env.i18n.lang;
                    if (lang === 'en' || lang.startsWith('en-')) {
                        playerLang = 'en';
                    } else {
                        playerLang = 'ru';
                    }
                    t = texts[playerLang];
                    allDilemmas = generateDilemmas(playerLang);
                    // Game Ready API
                    ysdk.features.LoadingAPI?.ready();
                } catch (e) {
                    // Если SDK не загрузился, используем русский по умолчанию
                    allDilemmas = generateDilemmas('ru');
                    t = texts.ru;
                }
                // Обновим подсказку и кнопку
                hintDiv.textContent = t.hint;
                restartBtn.textContent = t.restart;
                initGame();
                gameLoop();
            }

            // ---------- КЛАССЫ ОБЪЕКТОВ ----------
            class Obstacle {
                constructor(col) {
                    this.col = col;
                    this.width = 35;
                    this.height = 50;
                    this.x = col * colWidth + (colWidth - this.width) / 2;
                    this.y = -this.height;
                    this.type = Math.random() < 0.5 ? 'toxic' : 'virus';
                }
                update() {
                    this.y += gameSpeed;
                }
                draw(ctx) {
                    ctx.save();
                    if (this.type === 'toxic') {
                        ctx.fillStyle = '#333';
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 15;
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = 'white';
                        ctx.fillRect(this.x+5, this.y+15, 8, 8);
                        ctx.fillRect(this.x+22, this.y+15, 8, 8);
                        ctx.fillStyle = 'red';
                        ctx.fillRect(this.x+7, this.y+17, 4, 4);
                        ctx.fillRect(this.x+24, this.y+17, 4, 4);
                    } else {
                        ctx.fillStyle = '#a020f0';
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(this.x+15, this.y+5);
                        ctx.lineTo(this.x+25, this.y-5);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x, y: this.y, w: this.width, h: this.height };
                }
            }

            class GoodItem {
                constructor(col) {
                    this.col = col;
                    this.size = 38;
                    this.x = col * colWidth + (colWidth - this.size) / 2;
                    this.y = -this.size;
                }
                update() {
                    this.y += gameSpeed;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.shadowColor = '#ffdd00';
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('👍', this.x + this.size/2, this.y + this.size/2);
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x, y: this.y, w: this.size, h: this.size };
                }
            }

            // ---------- ФУНКЦИИ ИГРЫ ----------
            function initGame() {
                colWidth = canvas.width / COL_COUNT;
                playerCol = 1;
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                playerY = canvas.height - playerHeight - 20;
                obstacles = [];
                goodItems = [];
                score = 0;
                lives = 3;
                gameSpeed = 5;
                isGameOver = false;
                dilemmaActive = false;
                dilemmaData = null;
                shieldActive = false;
                shieldTimer = 0;
                frameCount = 0;
                dilemmaResolvedCount = 0;
                dilemmaIndex = 0;
                dilemmaButtons = [];
                restartBtn.style.display = 'none';
                hintDiv.style.display = 'block';
                updateUI();
            }

            function updateUI() {
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
                dilemmaCountSpan.textContent = dilemmaResolvedCount + '/' + MAX_DILEMMAS;
            }

            function spawnObjects() {
                if (Math.random() < 0.02) {
                    let col = Math.floor(Math.random() * COL_COUNT);
                    obstacles.push(new Obstacle(col));
                }
                if (Math.random() < 0.015) {
                    let col = Math.floor(Math.random() * COL_COUNT);
                    goodItems.push(new GoodItem(col));
                }
            }

            function checkCollisions() {
                const playerBounds = { x: playerX, y: playerY, w: playerWidth, h: playerHeight };

                for (let i = obstacles.length-1; i >= 0; i--) {
                    const obs = obstacles[i];
                    if (rectCollide(playerBounds, obs.getBounds())) {
                        if (shieldActive) {
                            obstacles.splice(i,1);
                            shieldActive = false;
                            shieldTimer = 0;
                            canvas.style.boxShadow = '0 0 50px #00ff00';
                            setTimeout(()=>{ canvas.style.boxShadow = '0 0 30px #e94560'; }, 200);
                            continue;
                        }
                        loseLife();
                        obstacles.splice(i,1);
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                }

                for (let i = goodItems.length-1; i >= 0; i--) {
                    const item = goodItems[i];
                    if (rectCollide(playerBounds, item.getBounds())) {
                        score += 20;
                        goodItems.splice(i,1);
                        updateUI();
                    }
                }
            }

            function loseLife() {
                lives--;
                updateUI();
                // Визуальная обратная связь
                canvas.style.transform = 'translate(5px, 3px)';
                setTimeout(()=>{ canvas.style.transform = 'translate(0,0)'; }, 100);
            }

            function rectCollide(r1, r2) {
                return r1.x < r2.x + r2.w &&
                       r1.x + r1.w > r2.x &&
                       r1.y < r2.y + r2.h &&
                       r1.y + r1.h > r2.y;
            }

            function gameOver() {
                isGameOver = true;
                dilemmaActive = false;
                restartBtn.style.display = 'block';
                hintDiv.style.display = 'none';
            }

            function activateDilemma() {
                if (dilemmaResolvedCount >= MAX_DILEMMAS) {
                    // Игрок прошёл все 100 дилемм
                    isGameOver = true;
                    dilemmaActive = false;
                    restartBtn.style.display = 'block';
                    hintDiv.style.display = 'none';
                    return;
                }
                if (allDilemmas.length === 0) return;
                dilemmaActive = true;
                dilemmaData = allDilemmas[dilemmaIndex % allDilemmas.length];
                dilemmaIndex++;
                dilemmaButtons = [];
            }

            function resolveDilemma(choice) {
                if (!dilemmaActive || !dilemmaData) return;
                const result = choice === 'good' ? dilemmaData.good : dilemmaData.bad;
                score += result.points;
                if (score < 0) score = 0;
                dilemmaResolvedCount++;
                updateUI();

                if (result.shield) {
                    shieldActive = true;
                    shieldTimer = 180;
                }
                if (result.shake) {
                    canvas.style.transform = 'translate(5px, 3px)';
                    setTimeout(()=>{ canvas.style.transform = 'translate(0,0)'; }, 100);
                }

                dilemmaActive = false;
                dilemmaData = null;
                dilemmaButtons = [];

                // Проверка завершения игры после 100 дилемм
                if (dilemmaResolvedCount >= MAX_DILEMMAS && !isGameOver) {
                    // Показываем экран победы
                    isGameOver = true;
                    restartBtn.style.display = 'block';
                    hintDiv.style.display = 'none';
                }
            }

            // ---------- ОТРИСОВКА ----------
            function drawBackground() {
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#0f0c29');
                grad.addColorStop(0.5, '#302b63');
                grad.addColorStop(1, '#24243e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 2;
                ctx.setLineDash([15, 10]);
                for (let i = 1; i < COL_COUNT; i++) {
                    const x = i * colWidth;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }

            function drawPlayer() {
                ctx.save();
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 25;

                if (shieldActive) {
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 40;
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(playerX + playerWidth/2, playerY + playerHeight/2, 40, 0, Math.PI*2);
                    ctx.stroke();
                }

                ctx.font = '50px Arial';
                ctx.fillText('🏃', playerX-5, playerY+45);
                ctx.restore();
            }

            function drawGameOverOverlay() {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 26px Arial';
                ctx.textAlign = 'center';
                if (dilemmaResolvedCount >= MAX_DILEMMAS) {
                    ctx.fillText(t.win, canvas.width/2, canvas.height/2-30);
                } else {
                    ctx.fillText(t.gameOver, canvas.width/2, canvas.height/2-30);
                }
                ctx.font = '18px Arial';
                ctx.fillText(t.score + ': ' + score, canvas.width/2, canvas.height/2+20);
                drawRestartButtonInsideCanvas();
            }

            function drawRestartButtonInsideCanvas() {
                const btnWidth = 200;
                const btnHeight = 50;
                const btnX = canvas.width/2 - btnWidth/2;
                const btnY = canvas.height/2 + 50;
                window._restartBtnCoords = { x: btnX, y: btnY, w: btnWidth, h: btnHeight };

                ctx.fillStyle = '#e94560';
                ctx.shadowColor = '#ff4d6d';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, btnWidth, btnHeight, 30);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px Arial';
                ctx.fillText(t.restart, canvas.width/2, btnY + btnHeight/2 + 2);
            }

            function drawDilemmaPopup() {
                if (!dilemmaActive || !dilemmaData) return;

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const boxWidth = canvas.width * 0.85;
                const boxHeight = 220;
                const boxX = (canvas.width - boxWidth) / 2;
                const boxY = (canvas.height - boxHeight) / 2;

                ctx.fillStyle = '#2d2d44';
                ctx.shadowColor = '#e94560';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 20);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 15px Arial';
                ctx.textAlign = 'center';
                wrapText(ctx, dilemmaData.text, canvas.width/2, boxY + 40, boxWidth - 40, 20);

                const buttonWidth = boxWidth - 60;
                const buttonHeight = 45;
                const buttonX = boxX + 30;
                const goodY = boxY + 80;
                const badY = boxY + 135;

                dilemmaButtons = [
                    { x: buttonX, y: goodY, w: buttonWidth, h: buttonHeight, choice: 'good' },
                    { x: buttonX, y: badY, w: buttonWidth, h: buttonHeight, choice: 'bad' }
                ];

                drawButton(ctx, buttonX, goodY, buttonWidth, buttonHeight, dilemmaData.good.label, '#4caf50');
                drawButton(ctx, buttonX, badY, buttonWidth, buttonHeight, dilemmaData.bad.label, '#f44336');
            }

            function drawButton(ctx, x, y, w, h, text, color) {
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 10);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x + w/2, y + h/2);
            }

            function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '';
                let testLine;
                let lineY = y;
                for (let n = 0; n < words.length; n++) {
                    testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line, x, lineY);
                        line = words[n] + ' ';
                        lineY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, lineY);
            }

            // ---------- ИГРОВОЙ ЦИКЛ ----------
            function gameLoop() {
                if (isGameOver) {
                    drawBackground();
                    for (let obs of obstacles) obs.draw(ctx);
                    for (let item of goodItems) item.draw(ctx);
                    drawPlayer();
                    drawGameOverOverlay();
                    requestAnimationFrame(gameLoop);
                    return;
                }

                if (!dilemmaActive) {
                    frameCount++;
                    if (frameCount % 60 === 0 && gameSpeed < 12) {
                        gameSpeed += 0.2;
                    }

                    spawnObjects();

                    for (let obs of obstacles) obs.update();
                    for (let item of goodItems) item.update();

                    obstacles = obstacles.filter(obs => obs.y < canvas.height + obs.height);
                    goodItems = goodItems.filter(item => item.y < canvas.height + item.size);

                    checkCollisions();

                    if (shieldActive) {
                        shieldTimer--;
                        if (shieldTimer <= 0) shieldActive = false;
                    }

                    // Активация дилеммы раз в 7-10 секунд
                    if (frameCount % 420 === 0 && Math.random() < 0.6) {
                        activateDilemma();
                    }
                }

                drawBackground();
                for (let obs of obstacles) obs.draw(ctx);
                for (let item of goodItems) item.draw(ctx);
                drawPlayer();
                drawDilemmaPopup();

                requestAnimationFrame(gameLoop);
            }

            // ---------- УПРАВЛЕНИЕ ----------
            function handleInteraction(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                const canvasX = (clientX - rect.left) * scaleX;
                const canvasY = (clientY - rect.top) * scaleY;

                // Кнопка рестарта внутри canvas
                if (isGameOver && window._restartBtnCoords) {
                    const btn = window._restartBtnCoords;
                    if (canvasX >= btn.x && canvasX <= btn.x + btn.w &&
                        canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                        initGame();
                        return;
                    }
                }

                // Кнопки дилеммы
                if (dilemmaActive && dilemmaButtons.length === 2) {
                    for (let btn of dilemmaButtons) {
                        if (canvasX >= btn.x && canvasX <= btn.x + btn.w &&
                            canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                            resolveDilemma(btn.choice);
                            return;
                        }
                    }
                    return;
                }

                if (isGameOver) return;

                // Переключение дорожек по горизонтали
                if (canvasX < colWidth) {
                    playerCol = 0;
                } else if (canvasX < 2 * colWidth) {
                    playerCol = 1;
                } else {
                    playerCol = 2;
                }
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
            }

            function handleTouchOrClick(e) {
                e.preventDefault();
                let clientX, clientY;
                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else if (e.changedTouches && e.changedTouches.length > 0) {
                    clientX = e.changedTouches[0].clientX;
                    clientY = e.changedTouches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                handleInteraction(clientX, clientY);
            }

            // Блокировка контекстного меню и долгого тапа
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            canvas.addEventListener('touchstart', handleTouchOrClick, {passive: false});
            canvas.addEventListener('mousedown', handleTouchOrClick);
            // Предотвращение swipe-to-refresh и выделения
            document.addEventListener('touchmove', (e) => {
                if (e.target === canvas || canvas.contains(e.target)) {
                    e.preventDefault();
                }
            }, {passive: false});

            restartBtn.addEventListener('click', () => {
                if (isGameOver) initGame();
            });
            restartBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (isGameOver) initGame();
            });

            // Управление клавишами (для десктопа)
            window.addEventListener('keydown', (e) => {
                if (dilemmaActive) {
                    if (e.key === '1' || e.key === 'ArrowLeft') resolveDilemma('good');
                    if (e.key === '2' || e.key === 'ArrowRight') resolveDilemma('bad');
                    return;
                }
                if (isGameOver) {
                    initGame();
                    return;
                }
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    playerCol = Math.max(0, playerCol - 1);
                    playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                } else if (e.key === 'ArrowRight' || e.key === 'd') {
                    playerCol = Math.min(COL_COUNT - 1, playerCol + 1);
                    playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                }
            });

            // Полифил roundRect
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };

            // Старт после инициализации SDK
            initSDK();
        })();
    </script>
</body>
</html>
