<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation, viewport-fit=cover">
    <title>Разрыв — вырвись из круга</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a2e; font-family: 'Arial', sans-serif; height: 100vh; width: 100vw; overflow: hidden; touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        #gameContainer { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
        canvas { display: block; border: 3px solid #e94560; border-radius: 20px; box-shadow: 0 0 30px #e94560; margin-top: 5px; max-width: 95%; max-height: 75vh; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; z-index: 10; pointer-events: none; display: flex; gap: 12px; }
        #bottomUI { width: 95%; max-width: 400px; display: flex; flex-direction: column; align-items: center; margin-top: 8px; }
        #restartBtn { background: #e94560; color: white; border: none; padding: 12px 25px; font-size: 20px; font-weight: bold; border-radius: 30px; box-shadow: 0 0 20px #ff4d6d; cursor: pointer; white-space: nowrap; display: none; margin: 5px 0; }
        #hint { color: rgba(255,255,255,0.8); font-size: 13px; text-align: center; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 15px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="bottomUI">
            <div id="hint">👈 Нажимай левее/правее, чтобы менять дорожку! Лови 👍 и уворачивайся</div>
            <button id="restartBtn">🔄 Начать заново</button>
        </div>
    </div>
    <div id="ui">
        <span>⭐ <span id="scoreDisplay">0</span></span>
        <span>❤️ <span id="livesDisplay">3</span></span>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const livesSpan = document.getElementById('livesDisplay');
            const restartBtn = document.getElementById('restartBtn');
            const hintDiv = document.getElementById('hint');

            let W, H;

            function resizeCanvas() {
                W = Math.min(window.innerWidth - 20, 400);
                H = Math.min(window.innerHeight * 0.75, 750);
                canvas.width = W;
                canvas.height = H;
                if (typeof colWidth !== 'undefined') {
                    colWidth = W / 3;
                    playerX = playerCol * colWidth + colWidth/2 - 20;
                    playerY = H - 60 - 20;
                }
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const playerWidth = 40, playerHeight = 60;
            let colWidth = W / 3;
            let playerCol = 1;
            let playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
            let playerY = H - playerHeight - 20;
            let obstacles = [], goodItems = [];
            let score = 0, lives = 3, gameSpeed = 5;
            let isGameOver = false;
            let frameCount = 0;

            class Obstacle {
                constructor(col) {
                    this.width = 35; this.height = 50;
                    this.col = col;
                    this.x = col * colWidth + (colWidth - this.width) / 2;
                    this.y = -this.height;
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.fillStyle = '#333';
                    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 15;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.fillStyle = 'white';
                    ctx.fillRect(this.x+5, this.y+15, 8, 8);
                    ctx.fillRect(this.x+22, this.y+15, 8, 8);
                    ctx.fillStyle = 'red';
                    ctx.fillRect(this.x+7, this.y+17, 4, 4);
                    ctx.fillRect(this.x+24, this.y+17, 4, 4);
                }
                getBounds() { return {x: this.x, y: this.y, w: this.width, h: this.height}; }
            }

            class GoodItem {
                constructor(col) {
                    this.size = 38; this.col = col;
                    this.x = col * colWidth + (colWidth - this.size) / 2;
                    this.y = -this.size;
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.fillStyle = '#FFD700';
                    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('👍', this.x + this.size/2, this.y + this.size/2);
                }
                getBounds() { return {x: this.x, y: this.y, w: this.size, h: this.size}; }
            }

            function initGame() {
                obstacles = []; goodItems = [];
                score = 0; lives = 3; gameSpeed = 5; isGameOver = false;
                restartBtn.style.display = 'none';
                hintDiv.style.display = 'block';
                updateUI();
            }

            function updateUI() {
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
            }

            function spawnObjects() {
                if (Math.random() < 0.02) obstacles.push(new Obstacle(Math.floor(Math.random() * 3)));
                if (Math.random() < 0.02) goodItems.push(new GoodItem(Math.floor(Math.random() * 3)));
            }

            function checkCollisions() {
                const pb = {x: playerX, y: playerY, w: playerWidth, h: playerHeight};
                for (let i = obstacles.length-1; i >= 0; i--) {
                    if (pb.x < obstacles[i].x + obstacles[i].width && pb.x + pb.w > obstacles[i].x &&
                        pb.y < obstacles[i].y + obstacles[i].height && pb.y + pb.h > obstacles[i].y) {
                        lives--; obstacles.splice(i,1); updateUI();
                        if (lives <= 0) { isGameOver = true; restartBtn.style.display = 'block'; hintDiv.style.display = 'none'; return; }
                    }
                }
                for (let i = goodItems.length-1; i >= 0; i--) {
                    if (pb.x < goodItems[i].x + goodItems[i].size && pb.x + pb.w > goodItems[i].x &&
                        pb.y < goodItems[i].y + goodItems[i].size && pb.y + pb.h > goodItems[i].y) {
                        score += 10; goodItems.splice(i,1); updateUI();
                    }
                }
            }

            function drawBackground() {
                const grad = ctx.createLinearGradient(0,0,0,H);
                grad.addColorStop(0,'#0f0c29'); grad.addColorStop(0.5,'#302b63'); grad.addColorStop(1,'#24243e');
                ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
                ctx.strokeStyle = '#e94560'; ctx.lineWidth = 2; ctx.setLineDash([15,10]);
                for (let i=1; i<3; i++) { const x = i*colWidth; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
                ctx.setLineDash([]);
            }

            function drawPlayer() {
                ctx.font = '50px Arial';
                ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 25;
                ctx.fillText('🏃', playerX-5, playerY+45);
            }

            function gameLoop() {
                if (isGameOver) {
                    drawBackground();
                    obstacles.forEach(o=>o.draw(ctx));
                    goodItems.forEach(g=>g.draw(ctx));
                    drawPlayer();
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
                    ctx.fillStyle = 'white'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
                    ctx.fillText('Игра окончена!', W/2, H/2-30);
                    ctx.font = '18px Arial'; ctx.fillText('Рейтинг: '+score, W/2, H/2+20);
                    requestAnimationFrame(gameLoop);
                    return;
                }

                frameCount++;
                if (frameCount % 60 === 0 && gameSpeed < 12) gameSpeed += 0.2;

                spawnObjects();
                obstacles.forEach(o=>o.update());
                goodItems.forEach(g=>g.update());
                obstacles = obstacles.filter(o=>o.y < H+o.height);
                goodItems = goodItems.filter(g=>g.y < H+g.size);
                checkCollisions();

                drawBackground();
                obstacles.forEach(o=>o.draw(ctx));
                goodItems.forEach(g=>g.draw(ctx));
                drawPlayer();

                requestAnimationFrame(gameLoop);
            }

            // Управление
            function handleInteraction(cx, cy) {
                const rect = canvas.getBoundingClientRect();
                const sx = W / rect.width, sy = H / rect.height;
                const mx = (cx - rect.left)*sx;
                if (isGameOver) {
                    // рестарт по нажатию в центр
                    if (mx > W/4 && mx < 3*W/4) { initGame(); }
                    return;
                }
                playerCol = mx < colWidth ? 0 : mx < 2*colWidth ? 1 : 2;
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
            }

            canvas.addEventListener('contextmenu', e=>e.preventDefault());
            canvas.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.touches[0]; handleInteraction(t.clientX, t.clientY); }, {passive: false});
            canvas.addEventListener('mousedown', e=>handleInteraction(e.clientX, e.clientY));
            document.addEventListener('touchmove', e=>{ if (e.target===canvas) e.preventDefault(); }, {passive: false});

            restartBtn.addEventListener('click', ()=>{ initGame(); });
            restartBtn.addEventListener('touchend', e=>{ e.preventDefault(); initGame(); });

            initGame();
            gameLoop();
        })();
    </script>
</body>
</html>
