<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation, viewport-fit=cover">
    <title>Разрыв — вырвись из круга</title>
    <script src="https://yandex.ru/games/sdk/v2" async></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        body { background: #1a1a2e; font-family: 'Arial', sans-serif; height: 100vh; width: 100vw; overflow: hidden; touch-action: none; overscroll-behavior: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        #gameContainer { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
        canvas { display: block; border: 3px solid #e94560; border-radius: 20px; box-shadow: 0 0 30px #e94560; margin-top: 5px; max-width: 95%; max-height: 75vh; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: white; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; z-index: 10; pointer-events: none; display: flex; gap: 12px; }
        #bottomUI { width: 95%; max-width: 400px; display: flex; flex-direction: column; align-items: center; margin-top: 8px; }
        #restartBtn { background: #e94560; color: white; border: none; padding: 12px 25px; font-size: 20px; font-weight: bold; border-radius: 30px; box-shadow: 0 0 20px #ff4d6d; cursor: pointer; white-space: nowrap; display: none; margin: 5px 0; }
        #hint { color: rgba(255,255,255,0.8); font-size: 13px; text-align: center; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 15px; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="bottomUI">
            <div id="hint">👈 Нажимай левее/правее, чтобы менять дорожку! Лови 👍 и ❤️</div>
            <button id="restartBtn">🔄 Начать заново</button>
        </div>
    </div>
    <div id="ui">
        <span>⭐ <span id="scoreDisplay">0</span></span>
        <span>❤️ <span id="livesDisplay">3</span></span>
        <span>📋 <span id="dilemmaCountDisplay">0/100</span></span>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const livesSpan = document.getElementById('livesDisplay');
            const dilemmaCountSpan = document.getElementById('dilemmaCountDisplay');
            const restartBtn = document.getElementById('restartBtn');
            const hintDiv = document.getElementById('hint');

            let W, H;
            const COL_COUNT = 3;
            let colWidth;
            const playerWidth = 40, playerHeight = 60;
            let playerCol = 1;
            let playerX, playerY;

            function resizeCanvas() {
                W = Math.min(window.innerWidth - 20, 400);
                H = Math.min(window.innerHeight * 0.75, 750);
                canvas.width = W;
                canvas.height = H;
                colWidth = W / COL_COUNT;
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                playerY = H - playerHeight - 20;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let obstacles = [], goodItems = [], heartItems = [];
            let score = 0, lives = 3, gameSpeed = 5;
            let isGameOver = false, dilemmaActive = false, dilemmaData = null;
            let shieldActive = false, shieldTimer = 0;
            let frameCount = 0, dilemmaButtons = [];
            const MAX_LIVES = 5;
            const MAX_DILEMMAS = 100;

            let allDilemmas = [], shuffledDilemmas = [], dilemmaIndex = 0, dilemmaResolvedCount = 0;
            let playerLang = 'ru';
            let ysdkGlobal = null;

            // Тосты — «чатик»
            let toastMessage = null;
            let toastTimer = 0;
            const TOAST_DURATION = 120; // ~2 секунды при 60 fps

            const texts = {
                ru: { hint: '👈 Нажимай левее/правее, чтобы менять дорожку! Лови 👍 и ❤️', restart: '🔄 Начать заново', gameOver: 'Группировка затянула...', win: 'Ты вырвался! Поздравляем!' },
                en: { hint: '👈 Tap left/right to change lane! Catch 👍 and ❤️', restart: '🔄 Restart', gameOver: 'The group pulled you in...', win: 'You broke free! Congratulations!' }
            };

            // Наборы тостов (правильные и неправильные, RU/EN)
            const toastGoodRu = [
                "Вау, ты мыслишь ответственно!",
                "Это по-взрослому!",
                "Ты не поддался!",
                "Круто, ты сделал свой выбор!",
                "Так держать, ты сильнее!",
                "Вот это характер!",
                "Ты реально крут!",
                "Уважаю твоё решение!"
            ];
            const toastGoodEn = [
                "Wow, you're thinking responsibly!",
                "That's so mature!",
                "You didn't give in!",
                "Cool, you made your own choice!",
                "Keep it up, you're stronger!",
                "What a character!",
                "You're really awesome!",
                "I respect your decision!"
            ];
            const toastBadRu = [
                "Так ответили 80% — это развод…",
                "Бывает, тебя развели как и многих",
                "Ты попался на ту же удочку, что и большинство",
                "Многие ведутся, но ты можешь иначе",
                "Тебя только что использовали, как и 90% ребят",
                "Это ловушка, в которую попадаются почти все",
                "Тебя развели, но в следующий раз ты заметишь",
                "Почти все так ошибаются, главное — понять"
            ];
            const toastBadEn = [
                "80% answered like that — it's a trick…",
                "It happens, you got played like many others",
                "You fell for the same bait as most people",
                "Many fall for it, but you can do differently",
                "You just got used, like 90% of kids",
                "It's a trap almost everyone walks into",
                "You got tricked, but next time you'll notice",
                "Almost everyone makes that mistake, the key is to learn"
            ];

            let t = texts.ru;
            let toastGood = toastGoodRu;
            let toastBad = toastBadRu;

            // Установить язык
            function setLanguage(lang) {
                playerLang = lang;
                t = texts[lang];
                toastGood = lang === 'ru' ? toastGoodRu : toastGoodEn;
                toastBad = lang === 'ru' ? toastBadRu : toastBadEn;
                hintDiv.textContent = t.hint;
                restartBtn.textContent = t.restart;
            }

            function generateDilemmas(lang) {
                const situationsRu = [
                    "Токсичный друг зовёт на опасный челлендж.",
                    "В соцсетях травят одноклассника.",
                    "Незнакомец предлагает лёгкие деньги за странное задание.",
                    "Группировка требует доказать верность.",
                    "Тебе предлагают попробовать сигареты за компанию.",
                    "Одноклассники зовут прогулять уроки.",
                    "В чате пишут гадости про учителя.",
                    "Друг просит списать на экзамене.",
                    "Предлагают украсть мелочь из магазина.",
                    "Зовут на вечеринку, где будет алкоголь.",
                    "Незнакомец в сети просит твои личные данные.",
                    "Кто-то предлагает взломать чужой аккаунт.",
                    "Друг уговаривает попробовать наркотики.",
                    "Предлагают поучаствовать в травле новичка.",
                    "Тебя склоняют к вандализму в парке.",
                    "Зовут на опасную крышу сделать селфи.",
                    "Просят передать подозрительный пакет.",
                    "Предлагают солгать учителю о болезни.",
                    "Уговаривают не дружить с «неправильными» людьми.",
                    "Обещают много лайков за опасный трюк.",
                    "Говорят, что твой друг предатель, и требуют порвать с ним.",
                    "Показывают жестокое видео и смеются.",
                    "Принуждают написать оскорбительный комментарий.",
                    "Сказали, что все «свои» носят определённый знак.",
                    "Угрожают распространить слух, если не сделаешь задание.",
                    "Предлагают отомстить обидчику анонимно.",
                    "Призывают бойкотировать одноклассника.",
                    "Зовут проникнуть в заброшенное здание.",
                    "Обещают секретное членство в крутом клубе.",
                    "Просят спрятать чужую вещь.",
                    "Склоняют к игре в карты на деньги.",
                    "Призывают не слушаться родителей.",
                    "Говорят, что ты обязан доказать свою крутость.",
                    "Подначивают украсть ответы к контрольной.",
                    "Требуют скинуть интимное фото.",
                    "Предлагают подставить другого ученика.",
                    "Убеждают, что законы — для слабаков.",
                    "Зовут устроить драку с параллельным классом.",
                    "Показывают, как обойти школьный интернет-фильтр.",
                    "Сулят лёгкий заработок на странных переводах.",
                    "Говорят, что только так ты станешь своим.",
                    "Требуют оскорбить учителя в лицо.",
                    "Настаивают, чтобы ты удалил все соцсети.",
                    "Предлагают за деньги распространить листовки.",
                    "Принуждают носить скрытое оружие.",
                    "Зовут на ночную «операцию».",
                    "Уверяют, что твои друзья тебя используют.",
                    "Предлагают попробовать «лёгкий» наркотик.",
                    "Сказали, что твой парень/девушка тебе изменяет, и надо отомстить.",
                    "Вынуждают врать ради общего дела."
                ];
                const situationsEn = [
                    "A toxic friend invites you to a dangerous challenge.",
                    "A classmate is being bullied on social media.",
                    "A stranger offers easy money for a strange task.",
                    "The group demands proof of loyalty.",
                    "You are offered to try cigarettes for company.",
                    "Classmates invite you to skip classes.",
                    "Nasty things about the teacher are written in chat.",
                    "A friend asks to copy on an exam.",
                    "They offer to steal a small item from a store.",
                    "You are invited to a party where there will be alcohol.",
                    "A stranger online asks for your personal data.",
                    "Someone proposes to hack someone else's account.",
                    "A friend pressures you to try drugs.",
                    "They suggest joining in bullying a newcomer.",
                    "You are pushed to vandalize a park.",
                    "A group calls you to take a dangerous rooftop selfie.",
                    "Someone asks you to deliver a suspicious package.",
                    "You are prompted to lie to a teacher about being sick.",
                    "They urge you not to be friends with 'wrong' people.",
                    "You are promised many likes for a risky stunt.",
                    "They say your friend betrayed you and demand you cut ties.",
                    "They show a violent video and laugh.",
                    "You are forced to write an insulting comment.",
                    "They said all 'insiders' wear a certain sign.",
                    "They threaten to spread a rumor if you don't complete a task.",
                    "They suggest getting anonymous revenge on an offender.",
                    "They call for a boycott of a classmate.",
                    "They invite you to break into an abandoned building.",
                    "They promise secret membership in a cool club.",
                    "You are asked to hide someone else's item.",
                    "They entice you to gamble with cards for money.",
                    "They encourage you to disobey parents.",
                    "They say you must prove your toughness.",
                    "They dare you to steal the test answers.",
                    "They demand you send an intimate photo.",
                    "They propose framing another student.",
                    "They convince you that laws are for the weak.",
                    "They call you to start a fight with another class.",
                    "They show how to bypass the school internet filter.",
                    "They promise easy money from strange transfers.",
                    "They say it's the only way to become one of them.",
                    "They demand you insult the teacher to their face.",
                    "They insist you delete all social media.",
                    "They offer money to distribute flyers.",
                    "They pressure you to carry a hidden weapon.",
                    "They invite you to a nighttime 'operation'.",
                    "They assure you your friends are using you.",
                    "They offer to try a 'soft' drug.",
                    "They said your partner is cheating and you should take revenge.",
                    "They force you to lie for the common cause."
                ];
                const questionsRu = ["Что сделаешь?", "Твой выбор?", "Как поступишь?"];
                const questionsEn = ["What will you do?", "Your choice?", "How will you act?"];
                const goodLabelsRu = [
                    "Скажу твёрдое «нет» и пойду своей дорогой",
                    "Объясню, почему это плохая идея, и откажусь",
                    "Предложу заняться чем-то реально крутым вместо этого",
                    "Просто уйду и заблокирую контакт",
                    "Скажу, что мне это неинтересно, и займусь своим делом",
                    "Пошлю смешной мем в ответ и выйду из чата",
                    "Подумаю, чем это может закончиться, и откажусь",
                    "Скажу, что у меня свои правила, и не поведусь",
                    "Выйду из ситуации и никому ничего не должен объяснять",
                    "Скажу, что мне нужно подумать, и потом откажусь",
                    "Вспомню, чему меня учили про манипуляции, и не поддамся",
                    "Сделаю вид, что не понял, и переведу тему",
                    "Поставлю себя на место жертвы и откажусь участвовать",
                    "Скажу, что это не моё дело, и не буду в это лезть",
                    "Расскажу родителям или тому, кому доверяю, чтобы посоветоваться"
                ];
                const goodLabelsEn = [
                    "Say a firm 'no' and walk my own way",
                    "Explain why it's a bad idea and refuse",
                    "Suggest doing something actually cool instead",
                    "Just leave and block the contact",
                    "Say I'm not interested and do my own thing",
                    "Send a funny meme back and exit the chat",
                    "Think about the consequences and say no",
                    "Say I have my own rules and won't fall for it",
                    "Exit the situation and owe no one an explanation",
                    "Say I need to think, then refuse later",
                    "Remember what I learned about manipulation and resist",
                    "Pretend I didn't get it and change the subject",
                    "Put myself in the victim's shoes and refuse to join",
                    "Say it's not my business and stay out of it",
                    "Tell my parents or someone I trust to get advice"
                ];
                const badLabelsRu = [
                    "Соглашусь, чтобы не быть белой вороной",
                    "Промолчу и сделаю вид, что согласен",
                    "Выполню, чтобы доказать свою крутость",
                    "Поддержу, ведь все так делают",
                    "Скажу, что подумаю, но ничего не сделаю",
                    "Сделаю, чтобы не потерять друзей",
                    "Подумаю, что это не моё дело",
                    "Посмеюсь вместе со всеми",
                    "Приму предложение, ведь это весело",
                    "Сделаю, чтобы меня не считали слабаком",
                    "Промолчу, чтобы не выделяться",
                    "Приму участие, чтобы не обидеть",
                    "Сделаю вид, что не слышал",
                    "Понадеюсь, что никто не узнает",
                    "Скажу, что я в деле"
                ];
                const badLabelsEn = [
                    "Agree not to stand out",
                    "Stay silent and pretend to agree",
                    "Do it to prove my toughness",
                    "Support it, since everyone does",
                    "Say I'll think about it but do nothing",
                    "Do it so I don't lose friends",
                    "Think it's none of my business",
                    "Laugh along with everyone",
                    "Accept the offer because it's fun",
                    "Do it so I'm not considered weak",
                    "Stay silent to not stand out",
                    "Join in to not offend anyone",
                    "Pretend I didn't hear",
                    "Hope that nobody finds out",
                    "Say I'm in"
                ];

                const sits = lang === 'ru' ? situationsRu : situationsEn;
                const quess = lang === 'ru' ? questionsRu : questionsEn;
                const goods = lang === 'ru' ? goodLabelsRu : goodLabelsEn;
                const bads = lang === 'ru' ? badLabelsRu : badLabelsEn;

                const dilemmas = [];
                for (let i = 0; i < 120; i++) {
                    dilemmas.push({
                        text: sits[i % sits.length] + ' ' + quess[i % quess.length],
                        good: { label: goods[Math.floor(Math.random() * goods.length)], points: 40 + Math.floor(Math.random() * 30), shield: true },
                        bad: { label: bads[Math.floor(Math.random() * bads.length)], points: -20 - Math.floor(Math.random() * 40), shake: true }
                    });
                }
                return dilemmas;
            }

            function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

            async function initSDK() {
                try {
                    if (typeof YaGames !== 'undefined') {
                        ysdkGlobal = await YaGames.init();
                        const lang = ysdkGlobal.environment.i18n.lang;
                        const newLang = (lang === 'en' || lang.startsWith('en-')) ? 'en' : 'ru';
                        if (newLang !== playerLang) {
                            setLanguage(newLang);
                            allDilemmas = generateDilemmas(playerLang);
                            startNewGame();
                        }
                    }
                } catch (e) { console.log('SDK offline'); }
            }

            class Obstacle {
                constructor(col) {
                    this.width = 35; this.height = 50; this.col = col;
                    this.x = col * colWidth + (colWidth - this.width) / 2;
                    this.y = -this.height;
                    this.type = Math.random() < 0.5 ? 'toxic' : 'virus';
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.save();
                    if (this.type === 'toxic') {
                        ctx.fillStyle = '#333'; ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 15;
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = 'white'; ctx.fillRect(this.x+5, this.y+15, 8, 8); ctx.fillRect(this.x+22, this.y+15, 8, 8);
                        ctx.fillStyle = 'red'; ctx.fillRect(this.x+7, this.y+17, 4, 4); ctx.fillRect(this.x+24, this.y+17, 4, 4);
                    } else {
                        ctx.fillStyle = '#a020f0'; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = 20;
                        ctx.beginPath(); ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2); ctx.fill();
                        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(this.x+15, this.y+5); ctx.lineTo(this.x+25, this.y-5); ctx.stroke();
                    }
                    ctx.restore();
                }
                getBounds() { return {x: this.x, y: this.y, w: this.width, h: this.height}; }
            }

            class GoodItem {
                constructor(col) {
                    this.size = 38; this.col = col;
                    this.x = col * colWidth + (colWidth - this.size) / 2;
                    this.y = -this.size;
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.save();
                    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 25; ctx.fillStyle = '#FFD700';
                    ctx.beginPath(); ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#000'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('👍', this.x + this.size/2, this.y + this.size/2);
                    ctx.restore();
                }
                getBounds() { return {x: this.x, y: this.y, w: this.size, h: this.size}; }
            }

            class HeartItem {
                constructor(col) {
                    this.size = 34; this.col = col;
                    this.x = col * colWidth + (colWidth - this.size) / 2;
                    this.y = -this.size;
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.save();
                    ctx.shadowColor = '#ff4466'; ctx.shadowBlur = 20; ctx.fillStyle = '#ff3366';
                    ctx.font = '28px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('❤️', this.x + this.size/2, this.y + this.size/2);
                    ctx.restore();
                }
                getBounds() { return {x: this.x, y: this.y, w: this.size, h: this.size}; }
            }

            function initGame() {
                playerCol = 1;
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                playerY = H - playerHeight - 20;
                obstacles = []; goodItems = []; heartItems = [];
                score = 0; lives = 3; gameSpeed = 5; isGameOver = false;
                dilemmaActive = false; dilemmaData = null;
                shieldActive = false; shieldTimer = 0;
                frameCount = 0; dilemmaButtons = [];
                toastMessage = null; toastTimer = 0;
                restartBtn.style.display = 'none'; hintDiv.style.display = 'block';
                updateUI();

                if (ysdkGlobal && ysdkGlobal.features && ysdkGlobal.features.LoadingAPI) {
                    ysdkGlobal.features.LoadingAPI.ready();
                }
            }

            function updateUI() {
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
                dilemmaCountSpan.textContent = dilemmaResolvedCount + '/' + MAX_DILEMMAS;
            }

            function spawnObjects() {
                if (Math.random() < 0.02) obstacles.push(new Obstacle(Math.floor(Math.random() * COL_COUNT)));
                if (Math.random() < 0.015) goodItems.push(new GoodItem(Math.floor(Math.random() * COL_COUNT)));
                if (Math.random() < 0.004) heartItems.push(new HeartItem(Math.floor(Math.random() * COL_COUNT)));
            }

            function checkCollisions() {
                const pb = {x: playerX, y: playerY, w: playerWidth, h: playerHeight};
                for (let i = obstacles.length-1; i >= 0; i--) {
                    if (rectCollide(pb, obstacles[i].getBounds())) {
                        if (shieldActive) { obstacles.splice(i,1); shieldActive = false; continue; }
                        loseLife(); obstacles.splice(i,1);
                        if (lives <= 0) { gameOver(); return; }
                    }
                }
                for (let i = goodItems.length-1; i >= 0; i--) {
                    if (rectCollide(pb, goodItems[i].getBounds())) { score += 20; goodItems.splice(i,1); updateUI(); }
                }
                for (let i = heartItems.length-1; i >= 0; i--) {
                    if (rectCollide(pb, heartItems[i].getBounds())) { if (lives < MAX_LIVES) { lives++; updateUI(); } heartItems.splice(i,1); }
                }
            }

            function loseLife() { lives--; updateUI(); canvas.style.transform = 'translate(5px, 3px)'; setTimeout(() => canvas.style.transform = '', 100); }
            function rectCollide(a,b) { return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

            function gameOver() { isGameOver = true; dilemmaActive = false; restartBtn.style.display = 'block'; hintDiv.style.display = 'none'; }

            function showToast(choice) {
                const arr = choice === 'good' ? toastGood : toastBad;
                toastMessage = arr[Math.floor(Math.random() * arr.length)];
                toastTimer = TOAST_DURATION;
            }

            function activateDilemma() {
                if (dilemmaResolvedCount >= MAX_DILEMMAS) { gameOver(); return; }
                if (!shuffledDilemmas.length) return;
                dilemmaActive = true;
                dilemmaData = shuffledDilemmas[dilemmaIndex % shuffledDilemmas.length];
                dilemmaIndex++;

                const choices = [
                    { label: dilemmaData.good.label, choice: 'good' },
                    { label: dilemmaData.bad.label, choice: 'bad' }
                ];
                if (Math.random() < 0.5) choices.reverse();

                dilemmaButtons = [
                    { label: choices[0].label, choice: choices[0].choice },
                    { label: choices[1].label, choice: choices[1].choice }
                ];
            }

            function resolveDilemma(choice) {
                if (!dilemmaActive || !dilemmaData) return;
                const res = choice === 'good' ? dilemmaData.good : dilemmaData.bad;
                score += res.points; if (score < 0) score = 0;
                dilemmaResolvedCount++; updateUI();
                if (res.shield) { shieldActive = true; shieldTimer = 180; }
                if (res.shake) { canvas.style.transform = 'translate(5px, 3px)'; setTimeout(() => canvas.style.transform = '', 100); }
                showToast(choice);
                dilemmaActive = false; dilemmaData = null; dilemmaButtons = [];
                if (dilemmaResolvedCount >= MAX_DILEMMAS && !isGameOver) { gameOver(); }
            }

            function drawToast() {
                if (!toastMessage || toastTimer <= 0) return;
                const alpha = Math.min(1, toastTimer / 30); // плавное появление
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const tw = ctx.measureText(toastMessage).width + 40;
                const th = 50;
                const tx = W/2 - tw/2;
                const ty = 50;
                ctx.fillStyle = '#333344';
                ctx.shadowColor = '#000000'; ctx.shadowBlur = 15;
                ctx.beginPath(); ctx.roundRect(tx, ty, tw, th, 15); ctx.fill();
                ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
                ctx.fillStyle = '#FFD966';
                ctx.font = 'bold 15px Arial';
                ctx.fillText(toastMessage, W/2, ty + th/2);
                ctx.restore();
            }

            function drawBackground() {
                const grad = ctx.createLinearGradient(0,0,0,H);
                grad.addColorStop(0,'#0f0c29'); grad.addColorStop(0.5,'#302b63'); grad.addColorStop(1,'#24243e');
                ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
                ctx.strokeStyle = '#e94560'; ctx.lineWidth = 2; ctx.setLineDash([15,10]);
                for (let i=1; i<COL_COUNT; i++) { const x = i*colWidth; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
                ctx.setLineDash([]);
            }

            function drawPlayer() {
                ctx.save();
                ctx.shadowColor = '#00ffff'; ctx.shadowBlur = 25;
                if (shieldActive) { ctx.shadowColor = '#00ff00'; ctx.shadowBlur = 40; ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(playerX+playerWidth/2, playerY+playerHeight/2, 40, 0, Math.PI*2); ctx.stroke(); }
                ctx.font = '50px Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText('🏃', playerX-5, playerY+45);
                ctx.restore();
            }

            function drawGameOverOverlay() {
                ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
                ctx.fillStyle = 'white'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(dilemmaResolvedCount >= MAX_DILEMMAS ? t.win : t.gameOver, W/2, H/2-30);
                ctx.font = '18px Arial'; ctx.fillText('Рейтинг: '+score, W/2, H/2+20);
                const bw=200, bh=50, bx=W/2-bw/2, by=H/2+50;
                window._restartBtnCoords = {x:bx, y:by, w:bw, h:bh};
                ctx.fillStyle = '#e94560'; ctx.shadowColor='#ff4d6d'; ctx.shadowBlur=20;
                ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,30); ctx.fill();
                ctx.shadowColor='transparent'; ctx.shadowBlur=0;
                ctx.fillStyle='white'; ctx.font='bold 20px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t.restart, W/2, by+bh/2);
            }

            function drawDilemmaPopup() {
                if (!dilemmaActive || !dilemmaData || dilemmaButtons.length === 0) return;
                ctx.save();
                ctx.font = 'bold 14px Arial';
                const lines = wrapLines(dilemmaData.text, W*0.7);
                const textH = lines.length * 20;
                const boxH = Math.max(200, 100 + textH + 80);
                const boxW = W * 0.85, boxX = (W - boxW) / 2, boxY = (H - boxH) / 2;

                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
                ctx.fillStyle = '#2d2d44'; ctx.shadowColor='#e94560'; ctx.shadowBlur=30;
                ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 20); ctx.fill();
                ctx.shadowColor='transparent'; ctx.shadowBlur=0;

                ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
                let yText = boxY + 30;
                lines.forEach(line => { ctx.fillText(line, W/2, yText); yText += 20; });

                const btnW = boxW - 60, btnH = 45;
                const btnX = boxX + 30;
                const btnY1 = yText + 20;
                const btnY2 = btnY1 + btnH + 10;

                if (dilemmaButtons[0]) { dilemmaButtons[0].x = btnX; dilemmaButtons[0].y = btnY1; dilemmaButtons[0].w = btnW; dilemmaButtons[0].h = btnH; }
                if (dilemmaButtons[1]) { dilemmaButtons[1].x = btnX; dilemmaButtons[1].y = btnY2; dilemmaButtons[1].w = btnW; dilemmaButtons[1].h = btnH; }

                drawButton(ctx, btnX, btnY1, btnW, btnH, dilemmaButtons[0].label, '#4e5b8c');
                drawButton(ctx, btnX, btnY2, btnW, btnH, dilemmaButtons[1].label, '#4e5b8c');
                ctx.restore();
            }

            function wrapLines(text, maxW) {
                const words = text.split(' '); const lines = []; let cur = '';
                words.forEach(w => { const test = cur ? cur+' '+w : w; if (ctx.measureText(test).width <= maxW) cur = test; else { lines.push(cur); cur = w; } });
                if (cur) lines.push(cur);
                return lines;
            }

            function drawButton(ctx, x, y, w, h, text, color) {
                ctx.fillStyle = color; ctx.shadowColor='#aaa'; ctx.shadowBlur=10;
                ctx.beginPath(); ctx.roundRect(x,y,w,h,10); ctx.fill();
                ctx.shadowColor='transparent'; ctx.shadowBlur=0;
                ctx.fillStyle='white'; let fs = 14; ctx.font = `bold ${fs}px Arial`;
                if (ctx.measureText(text).width > w-10) { fs = 12; ctx.font = `bold ${fs}px Arial`; }
                ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text, x+w/2, y+h/2);
            }

            function gameLoop() {
                if (isGameOver) {
                    drawBackground();
                    obstacles.forEach(o=>o.draw(ctx)); goodItems.forEach(g=>g.draw(ctx)); heartItems.forEach(h=>h.draw(ctx));
                    drawPlayer();
                    drawGameOverOverlay();
                    requestAnimationFrame(gameLoop);
                    return;
                }

                if (!dilemmaActive) {
                    frameCount++;
                    if (frameCount % 60 === 0 && gameSpeed < 12) gameSpeed += 0.2;

                    spawnObjects();
                    obstacles.forEach(o=>o.update()); goodItems.forEach(g=>g.update()); heartItems.forEach(h=>h.update());
                    obstacles = obstacles.filter(o=>o.y < H+o.height);
                    goodItems = goodItems.filter(g=>g.y < H+g.size);
                    heartItems = heartItems.filter(h=>h.y < H+h.size);

                    checkCollisions();

                    if (shieldActive && --shieldTimer <= 0) shieldActive = false;

                    if (frameCount === 90) activateDilemma();
                    else if (frameCount > 90 && frameCount % 180 === 0 && Math.random() < 0.85) activateDilemma();
                }

                // Таймер тоста
                if (toastTimer > 0) toastTimer--;

                drawBackground();
                obstacles.forEach(o=>o.draw(ctx)); goodItems.forEach(g=>g.draw(ctx)); heartItems.forEach(h=>h.draw(ctx));
                drawPlayer();
                drawDilemmaPopup();
                drawToast();

                requestAnimationFrame(gameLoop);
            }

            function handleInteraction(cx, cy) {
                const rect = canvas.getBoundingClientRect();
                const sx = W / rect.width, sy = H / rect.height;
                const mx = (cx - rect.left) * sx, my = (cy - rect.top) * sy;

                if (isGameOver && window._restartBtnCoords) {
                    const b = window._restartBtnCoords;
                    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) { startNewGame(); return; }
                }
                if (dilemmaActive && dilemmaButtons.length === 2) {
                    for (let btn of dilemmaButtons) {
                        if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) { resolveDilemma(btn.choice); return; }
                    }
                    return;
                }
                if (isGameOver) return;

                playerCol = mx < colWidth ? 0 : mx < 2*colWidth ? 1 : 2;
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
            }

            canvas.addEventListener('contextmenu', e => e.preventDefault());
            canvas.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; handleInteraction(t.clientX, t.clientY); }, {passive: false});
            canvas.addEventListener('mousedown', e => handleInteraction(e.clientX, e.clientY));
            document.addEventListener('touchmove', e => { if (e.target === canvas) e.preventDefault(); }, {passive: false});

            restartBtn.addEventListener('click', () => { if (isGameOver) startNewGame(); });
            restartBtn.addEventListener('touchend', e => { e.preventDefault(); if (isGameOver) startNewGame(); });

            window.addEventListener('keydown', e => {
                if (dilemmaActive) {
                    if (e.key === '1' || e.key === 'ArrowLeft') resolveDilemma(dilemmaButtons[0]?.choice);
                    if (e.key === '2' || e.key === 'ArrowRight') resolveDilemma(dilemmaButtons[1]?.choice);
                    return;
                }
                if (isGameOver) { startNewGame(); return; }
                if (e.key === 'ArrowLeft' || e.key === 'a') playerCol = Math.max(0, playerCol - 1);
                else if (e.key === 'ArrowRight' || e.key === 'd') playerCol = Math.min(COL_COUNT - 1, playerCol + 1);
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
            });

            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };

            function startNewGame() {
                shuffledDilemmas = shuffleArray([...allDilemmas]);
                dilemmaIndex = 0;
                dilemmaResolvedCount = 0;
                initGame();
            }

            allDilemmas = generateDilemmas('ru');
            shuffledDilemmas = shuffleArray([...allDilemmas]);
            initGame();
            gameLoop();
            initSDK();
        })();
    </script>
</body>
