<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation, viewport-fit=cover">
    <title>Разрыв — вырвись из круга</title>
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-overflow-scrolling: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        #gameContainer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        canvas {
            display: block;
            border: 3px solid #e94560;
            border-radius: 20px;
            box-shadow: 0 0 30px #e94560;
            margin-top: 5px;
            max-width: 95%;
            max-height: 75vh;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            gap: 12px;
        }
        #bottomUI {
            width: 95%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 8px;
        }
        #restartBtn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 0 20px #ff4d6d;
            cursor: pointer;
            white-space: nowrap;
            display: none;
            margin: 5px 0;
        }
        #hint {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            text-align: center;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="bottomUI">
            <div id="hint">👈 Нажимай левее/правее, чтобы менять дорожку! Лови 👍 и ❤️</div>
            <button id="restartBtn">🔄 Начать заново</button>
        </div>
    </div>
    <div id="ui">
        <span>⭐ <span id="scoreDisplay">0</span></span>
        <span>❤️ <span id="livesDisplay">3</span></span>
        <span>📋 <span id="dilemmaCountDisplay">0/100</span></span>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const livesSpan = document.getElementById('livesDisplay');
            const dilemmaCountSpan = document.getElementById('dilemmaCountDisplay');
            const restartBtn = document.getElementById('restartBtn');
            const hintDiv = document.getElementById('hint');

            // Адаптивный размер (без W/H, всё через canvas.width/height)
            function resizeCanvas() {
                const maxWidth = Math.min(window.innerWidth - 20, 400);
                const maxHeight = Math.min(window.innerHeight * 0.75, 750);
                canvas.width = maxWidth;
                canvas.height = maxHeight;
                if (typeof colWidth !== 'undefined') {
                    colWidth = canvas.width / COL_COUNT;
                    playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                    playerY = canvas.height - playerHeight - 20;
                }
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ---------- ПЕРЕМЕННЫЕ ИГРЫ ----------
            let ysdk = null;
            let playerLang = 'ru';
            let allDilemmas = [];
            let shuffledDilemmas = [];
            let dilemmaIndex = 0;
            const MAX_DILEMMAS = 100;
            let dilemmaResolvedCount = 0;
            const MAX_LIVES = 5;

            const COL_COUNT = 3;
            let colWidth = canvas.width / COL_COUNT;
            let playerCol = 1;
            const playerWidth = 40;
            const playerHeight = 60;
            let playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
            let playerY = canvas.height - playerHeight - 20;

            let obstacles = [];
            let goodItems = [];
            let heartItems = [];
            let score = 0;
            let lives = 3;
            let gameSpeed = 5;
            let isGameOver = false;
            let dilemmaActive = false;
            let dilemmaData = null;
            let shieldActive = false;
            let shieldTimer = 0;
            let frameCount = 0;
            let dilemmaButtons = [];

            const texts = {
                ru: {
                    hint: '👈 Нажимай левее/правее, чтобы менять дорожку! Лови 👍 и ❤️',
                    restart: '🔄 Начать заново',
                    gameOver: 'Группировка затянула...',
                    win: 'Ты вырвался! Поздравляем!',
                },
                en: {
                    hint: '👈 Tap left/right to change lane! Catch 👍 and ❤️',
                    restart: '🔄 Restart',
                    gameOver: 'The group pulled you in...',
                    win: 'You broke free! Congratulations!',
                }
            };
            let t = texts.ru;

            // Генерация дилемм (полный набор из 50 ситуаций)
            function generateDilemmas(lang) {
                const situationsRu = [
                    "Токсичный друг зовёт на опасный челлендж.",
                    "В соцсетях травят одноклассника.",
                    "Незнакомец предлагает лёгкие деньги за странное задание.",
                    "Группировка требует доказать верность.",
                    "Тебе предлагают попробовать сигареты за компанию.",
                    "Одноклассники зовут прогулять уроки.",
                    "В чате пишут гадости про учителя.",
                    "Друг просит списать на экзамене.",
                    "Предлагают украсть мелочь из магазина.",
                    "Зовут на вечеринку, где будет алкоголь.",
                    "Незнакомец в сети просит твои личные данные.",
                    "Кто-то предлагает взломать чужой аккаунт.",
                    "Друг уговаривает попробовать наркотики.",
                    "Предлагают поучаствовать в травле новичка.",
                    "Тебя склоняют к вандализму в парке.",
                    "Зовут на опасную крышу сделать селфи.",
                    "Просят передать подозрительный пакет.",
                    "Предлагают солгать учителю о болезни.",
                    "Уговаривают не дружить с «неправильными» людьми.",
                    "Обещают много лайков за опасный трюк.",
                    "Говорят, что твой друг предатель, и требуют порвать с ним.",
                    "Показывают жестокое видео и смеются.",
                    "Принуждают написать оскорбительный комментарий.",
                    "Сказали, что все «свои» носят определённый знак.",
                    "Угрожают распространить слух, если не сделаешь задание.",
                    "Предлагают отомстить обидчику анонимно.",
                    "Призывают бойкотировать одноклассника.",
                    "Зовут проникнуть в заброшенное здание.",
                    "Обещают секретное членство в крутом клубе.",
                    "Просят спрятать чужую вещь.",
                    "Склоняют к игре в карты на деньги.",
                    "Призывают не слушаться родителей.",
                    "Говорят, что ты обязан доказать свою крутость.",
                    "Подначивают украсть ответы к контрольной.",
                    "Требуют скинуть интимное фото.",
                    "Предлагают подставить другого ученика.",
                    "Убеждают, что законы — для слабаков.",
                    "Зовут устроить драку с параллельным классом.",
                    "Показывают, как обойти школьный интернет-фильтр.",
                    "Сулят лёгкий заработок на странных переводах.",
                    "Говорят, что только так ты станешь своим.",
                    "Требуют оскорбить учителя в лицо.",
                    "Настаивают, чтобы ты удалил все соцсети.",
                    "Предлагают за деньги распространить листовки.",
                    "Принуждают носить скрытое оружие.",
                    "Зовут на ночную «операцию».",
                    "Уверяют, что твои друзья тебя используют.",
                    "Предлагают попробовать «лёгкий» наркотик.",
                    "Сказали, что твой парень/девушка тебе изменяет, и надо отомстить.",
                    "Вынуждают врать ради общего дела."
                ];
                const questionsRu = ["Что сделаешь?", "Твой выбор?", "Как поступишь?"];
                const goodLabelsRu = [
                    "Откажусь и расскажу родителям",
                    "Поговорю с учителем или психологом",
                    "Обращусь на линию доверия",
                    "Просто уйду и заблокирую контакт",
                    "Позвоню родителям и спрошу совета",
                    "Посоветуюсь со старшим братом или сестрой",
                    "Поговорю с другом, которому доверяю",
                    "Напишу в службу поддержки",
                    "Позвоню на горячую линию",
                    "Расскажу всё классному руководителю",
                    "Скажу твёрдое «нет» и уйду",
                    "Объясню, что это опасно",
                    "Предложу другое, безопасное занятие",
                    "Сообщу администрации школы",
                    "Скачаю приложение для безопасности"
                ];
                const badLabelsRu = [
                    "Соглашусь, чтобы не быть белой вороной",
                    "Промолчу и сделаю вид, что согласен",
                    "Выполню, чтобы доказать свою крутость",
                    "Поддержу, ведь все так делают",
                    "Скажу, что подумаю, но ничего не сделаю",
                    "Сделаю, чтобы не потерять друзей",
                    "Подумаю, что это не моё дело",
                    "Посмеюсь вместе со всеми",
                    "Приму предложение, ведь это весело",
                    "Сделаю, чтобы меня не считали слабаком",
                    "Промолчу, чтобы не выделяться",
                    "Приму участие, чтобы не обидеть",
                    "Сделаю вид, что не слышал",
                    "Понадеюсь, что никто не узнает",
                    "Скажу, что я в деле"
                ];

                // Для английского пока используем те же (или можно добавить переводы)
                const situationsEn = situationsRu.map(s => s); // заглушка
                const questionsEn = ["What will you do?", "Your choice?", "How will you act?"];
                const goodLabelsEn = goodLabelsRu.map(l => l);
                const badLabelsEn = badLabelsRu.map(l => l);

                const dilemmas = [];
                const sits = lang === 'ru' ? situationsRu : situationsEn;
                const quess = lang === 'ru' ? questionsRu : questionsEn;
                const goods = lang === 'ru' ? goodLabelsRu : goodLabelsEn;
                const bads = lang === 'ru' ? badLabelsRu : badLabelsEn;

                for (let i = 0; i < 120; i++) {
                    const sit = sits[i % sits.length];
                    const ques = quess[i % quess.length];
                    const goodLabel = goods[Math.floor(Math.random() * goods.length)];
                    const badLabel = bads[Math.floor(Math.random() * bads.length)];
                    dilemmas.push({
                        text: sit + ' ' + ques,
                        good: {
                            label: goodLabel,
                            points: 40 + Math.floor(Math.random() * 30),
                            shield: Math.random() < 0.4  // щит с шансом 40%
                        },
                        bad: {
                            label: badLabel,
                            points: -20 - Math.floor(Math.random() * 40),
                            shake: true
                        }
                    });
                }
                return dilemmas;
            }

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            async function initSDK() {
                try {
                    ysdk = await YaGames.init();
                    const lang = ysdk.environment.i18n.lang;
                    playerLang = (lang === 'en' || lang.startsWith('en-')) ? 'en' : 'ru';
                    t = texts[playerLang];
                    allDilemmas = generateDilemmas(playerLang);
                    ysdk.features.LoadingAPI?.ready();
                } catch (e) {
                    allDilemmas = generateDilemmas('ru');
                    t = texts.ru;
                }
                hintDiv.textContent = t.hint;
                restartBtn.textContent = t.restart;
                startNewGame();
                gameLoop();
            }

            function startNewGame() {
                shuffledDilemmas = shuffleArray([...allDilemmas]);
                dilemmaIndex = 0;
                dilemmaResolvedCount = 0;
                initGame();
            }

            class Obstacle {
                constructor(col) {
                    this.col = col;
                    this.width = 35;
                    this.height = 50;
                    this.x = col * colWidth + (colWidth - this.width) / 2;
                    this.y = -this.height;
                    this.type = Math.random() < 0.5 ? 'toxic' : 'virus';
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.save();
                    if (this.type === 'toxic') {
                        ctx.fillStyle = '#333';
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 15;
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = 'white';
                        ctx.fillRect(this.x+5, this.y+15, 8, 8);
                        ctx.fillRect(this.x+22, this.y+15, 8, 8);
                        ctx.fillStyle = 'red';
                        ctx.fillRect(this.x+7, this.y+17, 4, 4);
                        ctx.fillRect(this.x+24, this.y+17, 4, 4);
                    } else {
                        ctx.fillStyle = '#a020f0';
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(this.x+15, this.y+5);
                        ctx.lineTo(this.x+25, this.y-5);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
                getBounds() { return {x: this.x, y: this.y, w: this.width, h: this.height}; }
            }

            class GoodItem {
                constructor(col) {
                    this.col = col;
                    this.size = 38;
                    this.x = col * colWidth + (colWidth - this.size) / 2;
                    this.y = -this.size;
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.save();
                    ctx.shadowColor = '#ffdd00';
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 22px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('👍', this.x + this.size/2, this.y + this.size/2);
                    ctx.restore();
                }
                getBounds() { return {x: this.x, y: this.y, w: this.size, h: this.size}; }
            }

            class HeartItem {
                constructor(col) {
                    this.col = col;
                    this.size = 34;
                    this.x = col * colWidth + (colWidth - this.size) / 2;
                    this.y = -this.size;
                }
                update() { this.y += gameSpeed; }
                draw(ctx) {
                    ctx.save();
                    ctx.shadowColor = '#ff4466';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ff3366';
                    ctx.font = '28px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('❤️', this.x + this.size/2, this.y + this.size/2);
                    ctx.restore();
                }
                getBounds() { return {x: this.x, y: this.y, w: this.size, h: this.size}; }
            }

            function initGame() {
                colWidth = canvas.width / COL_COUNT;
                playerCol = 1;
                playerX = playerCol * colWidth + colWidth/2 - playerWidth/2;
                playerY = canvas.height - playerHeight - 20;
                obstacles = [];
                goodItems = [];
                heartItems = [];
                score = 0;
                lives = 3;
                gameSpeed = 5;
                isGameOver = false;
                dilemmaActive = false;
                dilemmaData = null;
                shieldActive = false;
                shieldTimer = 0;
                frameCount = 0;
                dilemmaButtons = [];
                restartBtn.style.display = 'none';
                hintDiv.style.display = 'block';
                updateUI();
            }

            function updateUI() {
                scoreSpan.textContent = score;
                livesSpan.textContent = lives;
                dilemmaCountSpan.textContent = dilemmaResolvedCount + '/' + MAX_DILEMMAS;
            }

            function spawnObjects() {
                if (Math.random() < 0.02) obstacles.push(new Obstacle(Math.floor(Math.random() * COL_COUNT)));
                if (Math.random() < 0.015) goodItems.push(new GoodItem(Math.floor(Math.random() * COL_COUNT)));
                if (Math.random() < 0.004) heartItems.push(new HeartItem(Math.floor(Math.random() * COL_COUNT)));
            }

            function checkCollisions() {
                const pb = {x: playerX, y: playerY, w: playerWidth, h: playerHeight};
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    if (rectCollide(pb, obstacles[i].getBounds())) {
                        if (shieldActive) {
                            obstacles.splice(i, 1);
                            shieldActive = false;
                            canvas.style.boxShadow = '0 0 50px #00ff00';
                            setTimeout(() => canvas.style.boxShadow = '0 0 30px #e94560', 200);
                            continue;
                        }
                        loseLife();
                        obstacles.splice(i, 1);
                        if (lives <= 0) {
                            gameOver();
                            return;
                        }
                    }
                }
                for (let i = goodItems.length - 1; i >= 0; i--) {
                    if (rectCollide(pb, goodItems[i].getBounds())) {
                        score += 20;
                        goodItems.splice(i, 1);
                        updateUI();
                    }
                }
                for (let i = heartItems.length - 1; i >= 0; i--) {
                    if (rectCollide(pb, heartItems[i].getBounds())) {
                        if (lives < MAX_LIVES) {
                            lives++;
                            updateUI();
                        }
                        heartItems.splice(i, 1);
                    }
                }
            }

            function loseLife() {
                lives--;
                updateUI();
                canvas.style.transform = 'translate(5px, 3px)';
                setTimeout(() => canvas.style.transform = '', 100);
            }

            function rectCollide(a, b) {
                return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
            }

            function gameOver() {
                isGameOver = true;
                dilemmaActive = false;
                restartBtn.style.display = 'block';
                hintDiv.style.display = 'none';
            }

            function activateDilemma() {
                if (dilemmaResolvedCount >= MAX_DILEMMAS) {
                    gameOver();
                    return;
                }
                if (!shuffledDilemmas.length) return;
                dilemmaActive = true;
                dilemmaData = shuffledDilemmas[dilemmaIndex % shuffledDilemmas.length];
                dilemmaIndex++;
                dilemmaButtons = [];
            }

            function resolveDilemma(choice) {
                if (!dilemmaActive || !dilemmaData) return;
                const res = choice === 'good' ? dilemmaData.good : dilemmaData.bad;
                score += res.points;
                if (score < 0) score = 0;
                dilemmaResolvedCount++;
                updateUI();

                if (res.shield) {
                    shieldActive = true;
                    shieldTimer = 180; // 3 секунды
                }
                if (res.shake) {
                    canvas.style.transform = 'translate(5px, 3px)';
                    setTimeout(() => canvas.style.transform = '', 100);
                }

                dilemmaActive = false;
                dilemmaData = null;
                dilemmaButtons = [];
                if (dilemmaResolvedCount >= MAX_DILEMMAS && !isGameOver) {
                    gameOver();
                }
            }

            // ---------- ОТРИСОВКА ----------
            function drawBackground() {
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#0f0c29');
                grad.addColorStop(0.5, '#302b63');
                grad.addColorStop(1, '#24243e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 2;
                ctx.setLineDash([15, 10]);
                for (let i = 1; i < COL_COUNT; i++) {
                    const x = i * colWidth;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            }

            function drawPlayer() {
                ctx.save();
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 25;

                if (shieldActive) {
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 40;
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(playerX + playerWidth/2, playerY + playerHeight/2, 40, 0, Math.PI*2);
                    ctx.stroke();
                }

                ctx.font = '50px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                ctx.fillText('🏃', playerX - 5, playerY + 45);
                ctx.restore();
            }

            function drawGameOverOverlay() {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 26px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(
                    dilemmaResolvedCount >= MAX_DILEMMAS ? t.win : t.gameOver,
                    canvas.width / 2,
                    canvas.height / 2 - 30
                );
                ctx.font = '18px Arial';
                ctx.fillText('Рейтинг: ' + score, canvas.width / 2, canvas.height / 2 + 20);

                const bw = 200, bh = 50;
                const bx = canvas.width / 2 - bw / 2;
                const by = canvas.height / 2 + 50;
                window._restartBtnCoords = { x: bx, y: by, w: bw, h: bh };

                ctx.fillStyle = '#e94560';
                ctx.shadowColor = '#ff4d6d';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 30);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(t.restart, canvas.width / 2, by + bh / 2);
            }

            function drawDilemmaPopup() {
                if (!dilemmaActive || !dilemmaData) return;

                ctx.save();
                ctx.font = 'bold 14px Arial';
                const lines = wrapLines(dilemmaData.text, canvas.width * 0.7);
                const textH = lines.length * 20;
                const boxH = Math.max(180, 80 + textH + 90);
                const boxW = canvas.width * 0.85;
                const boxX = (canvas.width - boxW) / 2;
                const boxY = (canvas.height - boxH) / 2;

                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#2d2d44';
                ctx.shadowColor = '#e94560';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxW, boxH, 20);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                let yText = boxY + 30;
                lines.forEach(line => {
                    ctx.fillText(line, canvas.width / 2, yText);
                    yText += 20;
                });

                const btnW = boxW - 60, btnH = 40;
                const btnX = boxX + 30;
                const btnY1 = yText + 10;
                const btnY2 = btnY1 + btnH + 8;

                const choices = [
                    { label: dilemmaData.good.label, choice: 'good' },
                    { label: dilemmaData.bad.label, choice: 'bad' }
                ];
                if (Math.random() < 0.5) choices.reverse(); // случайный порядок

                dilemmaButtons = [
                    { x: btnX, y: btnY1, w: btnW, h: btnH, choice: choices[0].choice },
                    { x: btnX, y: btnY2, w: btnW, h: btnH, choice: choices[1].choice }
                ];

                // Обе кнопки одного нейтрального цвета
                drawButton(ctx, btnX, btnY1, btnW, btnH, choices[0].label, '#4e5b8c');
                drawButton(ctx, btnX, btnY2, btnW, btnH, choices[1].label, '#4e5b8c');
                ctx.restore();
            }

            function wrapLines(text, maxWidth) {
                const words = text.split(' ');
                const lines = [];
                let cur = '';
                words.forEach(w => {
                    const test = cur ? cur + ' ' + w : w;
                    if (ctx.measureText(test).width <= maxWidth) {
                        cur = test;
                    } else {
                        if (cur) lines.push(cur);
                        cur = w;
                    }
                });
                if (cur) lines.push(cur);
                return lines;
            }

            function drawButton(ctx, x, y, w, h, text, color) {
                ctx.fillStyle = color;
                ctx.shadowColor = '#aaa';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 10);
                ctx.fill();
                // Убираем тень для чёткого текста
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';

                let fontSize = 13;
                ctx.font = `bold ${fontSize}px Arial`;
                if (ctx.measureText(text).width > w - 10) {
                    fontSize = 11;
                    ctx.font = `bold ${fontSize}px Arial`;
                }
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x + w / 2, y + h / 2);
            }

            // ---------- ИГРОВОЙ ЦИКЛ ----------
            function gameLoop() {
                if (isGameOver) {
                    drawBackground();
                    obstacles.forEach(o => o.draw(ctx));
                    goodItems.forEach(g => g.draw(ctx));
                    heartItems.forEach(h => h.draw(ctx));
                    drawPlayer();
                    drawGameOverOverlay();
                    requestAnimationFrame(gameLoop);
                    return;
                }

                if (!dilemmaActive) {
                    frameCount++;
                    if (frameCount % 60 === 0 && gameSpeed < 12) gameSpeed += 0.2;

                    spawnObjects();
                    obstacles.forEach(o => o.update());
                    goodItems.forEach(g => g.update());
                    heartItems.forEach(h => h.update());

                    obstacles = obstacles.filter(o => o.y < canvas.height + o.height);
                    goodItems = goodItems.filter(g => g.y < canvas.height + g.size);
                    heartItems = heartItems.filter(h => h.y < canvas.height + h.size);

                    checkCollisions();

                    if (shieldActive && --shieldTimer <= 0) shieldActive = false;

                    // Первая дилемма через ~1.5 сек, затем каждые ~3 сек
                    if (frameCount === 90) {
                        activateDilemma();
                    } else if (frameCount > 90 && frameCount % 180 === 0 && Math.random() < 0.85) {
                        activateDilemma();
                    }
                }

                drawBackground();
                obstacles.forEach(o => o.draw(ctx));
                goodItems.forEach(g => g.draw(ctx));
                heartItems.forEach(h => h.draw(ctx));
                drawPlayer();
                drawDilemmaPopup();

                requestAnimationFrame(gameLoop);
            }

            // ---------- УПРАВЛЕНИЕ ----------
            function handleInteraction(cx, cy) {
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                const mx = (cx - rect.left) * sx;
                const my = (cy - rect.top) * sy;

                if (isGameOver && window._restartBtnCoords) {
                    const b = window._restartBtnCoords;
                    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
                        startNewGame();
                        return;
                    }
                }
                if (dilemmaActive && dilemmaButtons.length === 2) {
                    for (let btn of dilemmaButtons) {
                        if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
                            resolveDilemma(btn.choice);
                            return;
                        }
                    }
                    return;
                }
                if (isGameOver) return;

                playerCol = mx < colWidth ? 0 : mx < 2 * colWidth ? 1 : 2;
                playerX = playerCol * colWidth + colWidth / 2 - playerWidth / 2;
            }

            canvas.addEventListener('contextmenu', e => e.preventDefault());
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.touches[0];
                handleInteraction(t.clientX, t.clientY);
            }, { passive: false });
            canvas.addEventListener('mousedown', e => handleInteraction(e.clientX, e.clientY));
            document.addEventListener('touchmove', e => {
                if (e.target === canvas) e.preventDefault();
            }, { passive: false });

            restartBtn.addEventListener('click', () => { if (isGameOver) startNewGame(); });
            restartBtn.addEventListener('touchend', e => {
                e.preventDefault();
                if (isGameOver) startNewGame();
            });

            window.addEventListener('keydown', e => {
                if (dilemmaActive) {
                    if (e.key === '1' || e.key === 'ArrowLeft') resolveDilemma(dilemmaButtons[0]?.choice);
                    if (e.key === '2' || e.key === 'ArrowRight') resolveDilemma(dilemmaButtons[1]?.choice);
                    return;
                }
                if (isGameOver) { startNewGame(); return; }
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    playerCol = Math.max(0, playerCol - 1);
                } else if (e.key === 'ArrowRight' || e.key === 'd') {
                    playerCol = Math.min(COL_COUNT - 1, playerCol + 1);
                }
                playerX = playerCol * colWidth + colWidth / 2 - playerWidth / 2;
            });

            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };

            initSDK();
        })();
    </script>
</body>
