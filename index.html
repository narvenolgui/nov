<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, touch-action: manipulation">
    <title>Разрыв — вырвись из круга</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            flex-direction: column;
        }
        #gameContainer {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            border: 3px solid #e94560;
            border-radius: 20px;
            box-shadow: 0 0 30px #e94560;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 10;
            pointer-events: none;
        }
        #restartBtn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e94560;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            box-shadow: 0 0 20px #ff4d6d;
            display: none;
            z-index: 20;
            cursor: pointer;
            white-space: nowrap;
        }
        #hint {
            position: absolute;
            bottom: 5px;
            left: 10px;
            right: 10px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">⭐ Рейтинг: <span id="scoreDisplay">0</span></div>
        <button id="restartBtn">🔄 Начать заново</button>
        <div id="hint">Лови 👍 и уворачивайся от тёмных фигур и вирусов!</div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const restartBtn = document.getElementById('restartBtn');
            const hintDiv = document.getElementById('hint');

            // Адаптивный размер
            function resizeCanvas() {
                const maxWidth = Math.min(window.innerWidth - 20, 400);
                const maxHeight = Math.min(window.innerHeight - 20, 700);
                canvas.width = maxWidth;
                canvas.height = maxHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Переменные игры
            const LANE_COUNT = 3;
            let laneHeight;
            let playerX, playerY;
            const playerWidth = 40;
            const playerHeight = 60;
            let playerLane = 1;

            let obstacles = [];
            let goodItems = [];
            let score = 0;
            let gameSpeed = 5;
            let isGameOver = false;
            let dilemmaActive = false;
            let dilemmaData = null;
            let shieldActive = false;
            let shieldTimer = 0;
            let frameCount = 0;

            // Кнопки дилеммы (координаты)
            let dilemmaButtons = [];

            // Дилеммы
            const dilemmas = [
                {
                    text: "Токсичный друг зовёт на опасный челлендж. Что сделаешь?",
                    good: { label: "Откажусь и расскажу родителям", points: 50, shield: true },
                    bad: { label: "Соглашусь, чтобы не быть белой вороной", points: -30, shake: true }
                },
                {
                    text: "В соцсетях травят одноклассника. Твои действия?",
                    good: { label: "Поддержу его и сообщу учителю", points: 40, shield: false },
                    bad: { label: "Поставлю лайк под обидным постом", points: -40, shake: true }
                },
                {
                    text: "Незнакомец предлагает лёгкие деньги за странное задание.",
                    good: { label: "Откажусь и позвоню на линию доверия", points: 60, shield: true },
                    bad: { label: "Соглашусь, ведь деньги не лишние", points: -50, shake: true }
                },
                {
                    text: "Группировка требует доказать верность. Выбор:",
                    good: { label: "Выйти из круга и заняться спортом", points: 70, shield: false },
                    bad: { label: "Выполнить их требование", points: -60, shake: true }
                }
            ];

            // Классы объектов
            class Obstacle {
                constructor(lane) {
                    this.lane = lane;
                    this.width = 30;
                    this.height = 50;
                    this.x = canvas.width;
                    this.y = lane * laneHeight + (laneHeight - this.height) / 2;
                    this.type = Math.random() < 0.5 ? 'toxic' : 'virus';
                }
                update() {
                    this.x -= gameSpeed;
                }
                draw(ctx) {
                    ctx.save();
                    if (this.type === 'toxic') {
                        ctx.fillStyle = '#333';
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 15;
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        ctx.fillStyle = 'white';
                        ctx.fillRect(this.x+5, this.y+15, 8, 8);
                        ctx.fillRect(this.x+17, this.y+15, 8, 8);
                        ctx.fillStyle = 'red';
                        ctx.fillRect(this.x+7, this.y+17, 4, 4);
                        ctx.fillRect(this.x+19, this.y+17, 4, 4);
                    } else {
                        ctx.fillStyle = '#a020f0';
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(this.x+10, this.y+5);
                        ctx.lineTo(this.x+20, this.y-5);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x, y: this.y, w: this.width, h: this.height };
                }
            }

            class GoodItem {
                constructor(lane) {
                    this.lane = lane;
                    this.size = 40; // увеличим для заметности
                    this.x = canvas.width;
                    this.y = lane * laneHeight + (laneHeight - this.size) / 2;
                }
                update() {
                    this.x -= gameSpeed;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.shadowColor = '#ffdd00';
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('👍', this.x + this.size/2, this.y + this.size/2);
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x, y: this.y, w: this.size, h: this.size };
                }
            }

            // Инициализация
            function initGame() {
                laneHeight = canvas.height / LANE_COUNT;
                playerX = 60;
                playerLane = 1;
                playerY = playerLane * laneHeight + (laneHeight - playerHeight) / 2;
                obstacles = [];
                goodItems = [];
                score = 0;
                gameSpeed = 5;
                isGameOver = false;
                dilemmaActive = false;
                dilemmaData = null;
                shieldActive = false;
                shieldTimer = 0;
                frameCount = 0;
                dilemmaButtons = [];
                restartBtn.style.display = 'none';
                hintDiv.style.display = 'block';
                updateScoreDisplay();
            }

            function spawnObjects() {
                if (Math.random() < 0.02) {
                    let lane = Math.floor(Math.random() * LANE_COUNT);
                    obstacles.push(new Obstacle(lane
