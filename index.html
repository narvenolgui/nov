<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Части суток | выбери и прикрепи слово</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #aad4cf;
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #fffef7;
            border-radius: 64px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.15);
            padding: 25px;
        }
        h1 {
            text-align: center;
            color: #2a6b47;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .sub {
            text-align: center;
            color: #5a7a6a;
            margin-bottom: 20px;
            font-size: 1rem;
            background: #fef3da;
            display: inline-block;
            width: 100%;
            padding: 6px;
            border-radius: 60px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 25px 0;
        }
        .card {
            background: #fff9ef;
            border-radius: 48px;
            padding: 18px 12px;
            text-align: center;
            box-shadow: 0 8px 0 #ddcca8;
            border: 2px solid #ffda9e;
        }
        .card-img {
            font-size: 4.8rem;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #b45f1b;
            background: #fef3da;
            display: inline-block;
            padding: 5px 18px;
            border-radius: 40px;
            margin-bottom: 12px;
        }
        .drop-zone {
            background: #eef3e0;
            border-radius: 60px;
            padding: 12px;
            min-height: 70px;
            border: 2px dashed #7fa87f;
            transition: 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .drop-zone.filled {
            background: #cfe6cf;
            border-color: #2a6b47;
        }
        .placed-word {
            background: #b0d9b1;
            color: #1e5a2a;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 1.2rem;
            box-shadow: none;
            display: inline-block;
        }
        .words-pool {
            background: #fff3e0;
            border-radius: 60px;
            padding: 20px;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        .word-btn {
            background: #ffaa44;
            color: #2d2b1f;
            border: none;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 60px;
            font-size: 1.3rem;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 0 #b97f2e;
            transition: 0.05s linear;
        }
        .word-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b97f2e;
        }
        .word-btn.selected {
            background: #f4a261;
            box-shadow: 0 0 0 2px #2a6b47;
            outline: none;
        }
        .word-btn.disabled-word {
            background: #c0c0a0;
            box-shadow: none;
            cursor: default;
            opacity: 0.6;
            transform: none;
        }
        .reset-btn {
            background: #7fa87f;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            color: white;
            margin-top: 20px;
            font-family: inherit;
            transition: 0.1s;
        }
        .reset-btn:active {
            transform: scale(0.97);
        }
        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 40px;
        }
        .success {
            background: #d9f0da;
            color: #1e5a2a;
        }
        .error {
            background: #ffe0e0;
            color: #a1131e;
        }
        .copyright {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 25px;
            color: #aac7be;
        }
        @media (max-width: 700px) {
            .card-img { font-size: 3.5rem; }
            .word-btn { font-size: 1rem; padding: 8px 20px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🌞 Части суток</h1>
    <div class="sub">Нажми на слово, затем на пустое место под картинкой</div>

    <div class="grid" id="cardsGrid">
        <!-- утро -->
        <div class="card" data-part="утро">
            <div class="card-img">🌅</div>
            <div class="card-title">УТРО</div>
            <div class="drop-zone" data-part="утро" id="drop-утро"></div>
        </div>
        <!-- день -->
        <div class="card" data-part="день">
            <div class="card-img">☀️</div>
            <div class="card-title">ДЕНЬ</div>
            <div class="drop-zone" data-part="день" id="drop-день"></div>
        </div>
        <!-- вечер -->
        <div class="card" data-part="вечер">
            <div class="card-img">🌇</div>
            <div class="card-title">ВЕЧЕР</div>
            <div class="drop-zone" data-part="вечер" id="drop-вечер"></div>
        </div>
        <!-- ночь -->
        <div class="card" data-part="ночь">
            <div class="card-img">🌙✨</div>
            <div class="card-title">НОЧЬ</div>
            <div class="drop-zone" data-part="ночь" id="drop-ночь"></div>
        </div>
    </div>

    <div class="words-pool" id="wordsPool">
        <button class="word-btn" data-word="утро">утро</button>
        <button class="word-btn" data-word="день">день</button>
        <button class="word-btn" data-word="вечер">вечер</button>
        <button class="word-btn" data-word="ночь">ночь</button>
    </div>

    <button class="reset-btn" id="resetBtn">🔄 Начать заново</button>
    <div id="messageArea" class="message"></div>
    <div class="copyright">окружающий мир · 1 класс</div>
</div>

<script>
    // Состояние: какая зона какое слово получила
    let assignments = {
        утро: null,
        день: null,
        вечер: null,
        ночь: null
    };
    // Выбранное в данный момент слово (чтобы перенести)
    let selectedWord = null;

    const dropZones = {
        утро: document.getElementById('drop-утро'),
        день: document.getElementById('drop-день'),
        вечер: document.getElementById('drop-вечер'),
        ночь: document.getElementById('drop-ночь')
    };
    const wordBtns = document.querySelectorAll('.word-btn');
    const resetBtn = document.getElementById('resetBtn');
    const messageDiv = document.getElementById('messageArea');

    // Обновить внешний вид зон (отобразить слово, если назначено)
    function updateZones() {
        for (let part in dropZones) {
            const zoneDiv = dropZones[part];
            zoneDiv.innerHTML = '';
            const word = assignments[part];
            if (word) {
                zoneDiv.classList.add('filled');
                const span = document.createElement('span');
                span.className = 'placed-word';
                span.innerText = word;
                zoneDiv.appendChild(span);
            } else {
                zoneDiv.classList.remove('filled');
                // можно оставить пустым
            }
        }
    }

    // Обновить кнопки слов: блокировать уже использованные
    function updateButtons() {
        const usedWords = Object.values(assignments).filter(v => v !== null);
        wordBtns.forEach(btn => {
            const word = btn.getAttribute('data-word');
            if (usedWords.includes(word)) {
                btn.disabled = true;
                btn.classList.add('disabled-word');
            } else {
                btn.disabled = false;
                btn.classList.remove('disabled-word');
            }
        });
        // снять выделение с любого слова, если оно было
        clearSelected();
    }

    function clearSelected() {
        if (selectedWord) {
            document.querySelectorAll('.word-btn').forEach(btn => btn.classList.remove('selected'));
            selectedWord = null;
        }
    }

    // Проверка правильности и вывод сообщения
    function checkCompletion() {
        const allFilled = assignments.утро !== null && assignments.день !== null && assignments.вечер !== null && assignments.ночь !== null;
        if (!allFilled) {
            messageDiv.innerHTML = '';
            messageDiv.className = 'message';
            return;
        }
        let correct = true;
        if (assignments.утро !== 'утро') correct = false;
        if (assignments.день !== 'день') correct = false;
        if (assignments.вечер !== 'вечер') correct = false;
        if (assignments.ночь !== 'ночь') correct = false;

        if (correct) {
            messageDiv.innerHTML = '🎉 Отлично! Все слова на своих местах. 🎉';
            messageDiv.className = 'message success';
        } else {
            messageDiv.innerHTML = '❌ Некоторые слова перепутаны. Нажми «Начать заново» и попробуй ещё раз.';
            messageDiv.className = 'message error';
        }
    }

    // Действие при клике на зону
    function onZoneClick(part) {
        if (assignments[part] !== null) {
            // Если в зоне уже есть слово, ничего не делаем (нужно сначала сбросить)
            return;
        }
        if (!selectedWord) {
            // нет выбранного слова – показываем подсказку
            messageDiv.innerHTML = 'Сначала нажми на слово внизу, затем на пустое место.';
            messageDiv.className = 'message error';
            setTimeout(() => {
                if (!messageDiv.innerHTML.includes('Нажми')) messageDiv.innerHTML = '';
                else messageDiv.innerHTML = '';
            }, 1500);
            return;
        }
        // Переносим выбранное слово в эту зону
        assignments[part] = selectedWord;
        updateZones();
        updateButtons();
        clearSelected();
        checkCompletion();
        // очистить сообщение
        messageDiv.innerHTML = '';
        messageDiv.className = 'message';
    }

    // Сброс игры
    function resetGame() {
        assignments = { утро: null, день: null, вечер: null, ночь: null };
        selectedWord = null;
        updateZones();
        updateButtons();
        clearSelected();
        messageDiv.innerHTML = '';
        messageDiv.className = 'message';
    }

    // Обработчики для слов
    function initWordButtons() {
        wordBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (btn.disabled) return;
                // Убираем выделение у всех
                document.querySelectorAll('.word-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedWord = btn.getAttribute('data-word');
                // убираем сообщение об ошибке
                if (messageDiv.classList.contains('error')) messageDiv.innerHTML = '';
            });
        });
    }

    // Обработчики для зон
    function initZones() {
        for (let part in dropZones) {
            const zone = dropZones[part];
            zone.addEventListener('click', (e) => {
                e.stopPropagation();
                onZoneClick(part);
            });
        }
    }

    // Чтобы клик на уже размещённом слове (внутри зоны) не срабатывал на зону
    function preventBubbling() {
        // При клике на .placed-word не вызывать родительский клик
        document.querySelectorAll('.drop-zone').forEach(zone => {
            zone.addEventListener('click', (e) => {
                if (e.target.closest('.placed-word')) {
                    e.stopPropagation();
                }
            });
        });
    }

    resetBtn.addEventListener('click', resetGame);

    initWordButtons();
    initZones();
    updateZones();
    updateButtons();
    preventBubbling();
</script>
</body>
</html>
