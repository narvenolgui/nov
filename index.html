<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Разрыв — вырвись из круга</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none; /* чтобы не скроллилось на телефоне */
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            border: 3px solid #e94560;
            border-radius: 20px;
            box-shadow: 0 0 30px #e94560;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="ui">⭐ Рейтинг: <span id="scoreDisplay">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');

            // Адаптивный размер под экран
            function resizeCanvas() {
                const maxWidth = Math.min(window.innerWidth - 20, 400);
                const maxHeight = Math.min(window.innerHeight - 20, 700);
                canvas.width = maxWidth;
                canvas.height = maxHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // ---------- ПЕРЕМЕННЫЕ ИГРЫ ----------
            const LANE_COUNT = 3;
            let laneHeight;
            let playerX, playerY;
            const playerWidth = 40;
            const playerHeight = 60;
            let playerLane = 1; // 0 верх, 1 центр, 2 низ

            let obstacles = [];
            let goodItems = [];
            let score = 0;
            let gameSpeed = 5;
            let isGameOver = false;
            let dilemmaActive = false;
            let dilemmaData = null;
            let shieldActive = false;
            let shieldTimer = 0;
            let frameCount = 0;

            // Для анимации персонажа
            let playerFrame = 0;
            const playerFrames = [
                '😎', '🏃', '😎'  // эмодзи для бега (можно заменить на спрайты)
            ];

            // Кнопки для дилеммы (будут рисоваться поверх canvas)
            let dilemmaButtons = [];

            // ---------- ДИЛЕММЫ (моральный выбор) ----------
            const dilemmas = [
                {
                    text: "Токсичный друг зовёт на опасный челлендж. Что сделаешь?",
                    good: { label: "Откажусь и расскажу родителям", points: 50, shield: true },
                    bad: { label: "Соглашусь, чтобы не быть белой вороной", points: -30, shake: true }
                },
                {
                    text: "В соцсетях травит одноклассника. Твои действия?",
                    good: { label: "Поддержу его и сообщу учителю", points: 40, shield: false },
                    bad: { label: "Поставлю лайк под обидным постом", points: -40, shake: true }
                },
                {
                    text: "Незнакомец предлагает лёгкие деньги за странное задание.",
                    good: { label: "Откажусь и позвоню на линию доверия", points: 60, shield: true },
                    bad: { label: "Соглашусь, ведь деньги не лишние", points: -50, shake: true }
                },
                {
                    text: "Группировка требует доказать верность. Выбор:",
                    good: { label: "Выйти из круга и заняться спортом", points: 70, shield: false },
                    bad: { label: "Выполнить их требование", points: -60, shake: true }
                }
            ];

            // ---------- КЛАССЫ ОБЪЕКТОВ ----------
            class Obstacle {
                constructor(lane) {
                    this.lane = lane;
                    this.width = 30;
                    this.height = 50;
                    this.x = canvas.width;
                    this.y = lane * laneHeight + (laneHeight - this.height) / 2;
                    this.type = Math.random() < 0.5 ? 'toxic' : 'virus'; // два вида
                }
                update() {
                    this.x -= gameSpeed;
                }
                draw(ctx) {
                    ctx.save();
                    // токсичный друг - тёмный силуэт с красными глазами
                    if (this.type === 'toxic') {
                        ctx.fillStyle = '#333';
                        ctx.shadowColor = '#ff0000';
                        ctx.shadowBlur = 15;
                        ctx.fillRect(this.x, this.y, this.width, this.height);
                        // глаза
                        ctx.fillStyle = 'white';
                        ctx.fillRect(this.x+5, this.y+15, 8, 8);
                        ctx.fillRect(this.x+17, this.y+15, 8, 8);
                        ctx.fillStyle = 'red';
                        ctx.fillRect(this.x+7, this.y+17, 4, 4);
                        ctx.fillRect(this.x+19, this.y+17, 4, 4);
                    } else { // вирус
                        ctx.fillStyle = '#a020f0';
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI*2);
                        ctx.fill();
                        // антенны вируса
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(this.x+10, this.y+5);
                        ctx.lineTo(this.x+20, this.y-5);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x, y: this.y, w: this.width, h: this.height };
                }
            }

            class GoodItem {
                constructor(lane) {
                    this.lane = lane;
                    this.size = 30;
                    this.x = canvas.width;
                    this.y = lane * laneHeight + (laneHeight - this.size) / 2;
                }
                update() {
                    this.x -= gameSpeed;
                }
                draw(ctx) {
                    ctx.save();
                    ctx.shadowColor = '#ffdd00';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(this.x + this.size/2, this.y + this.size/2, this.size/2, 0, Math.PI*2);
                    ctx.fill();
                    // звезда внутри
                    ctx.fillStyle = '#FFF';
                    ctx.font = '18px Arial';
                    ctx.fillText('👍', this.x+5, this.y+23);
                    ctx.restore();
                }
                getBounds() {
                    return { x: this.x, y: this.y, w: this.size, h: this.size };
                }
            }

            // ---------- ФУНКЦИИ ИГРЫ ----------
            function initGame() {
                laneHeight = canvas.height / LANE_COUNT;
                playerX = 60;
                playerLane = 1;
                playerY = playerLane * laneHeight + (laneHeight - playerHeight) / 2;
                obstacles = [];
                goodItems = [];
                score = 0;
                gameSpeed = 5;
                isGameOver = false;
                dilemmaActive = false;
                dilemmaData = null;
                shieldActive = false;
                shieldTimer = 0;
                frameCount = 0;
                dilemmaButtons = [];
                updateScoreDisplay();
            }

            function spawnObjects() {
                // Спавн с определённой вероятностью
                if (Math.random() < 0.02) { // препятствие
                    let lane = Math.floor(Math.random() * LANE_COUNT);
                    obstacles.push(new Obstacle(lane));
                }
                if (Math.random() < 0.015) { // хороший предмет
                    let lane = Math.floor(Math.random() * LANE_COUNT);
                    // чтобы не совпадал с только что появившимся препятствием (не обязательно, но лучше)
                    goodItems.push(new GoodItem(lane));
                }
            }

            function checkCollisions() {
                // Игрок
                const playerBounds = {
                    x: playerX,
                    y: playerY,
                    w: playerWidth,
                    h: playerHeight
                };

                // Препятствия
                for (let i = obstacles.length-1; i >= 0; i--) {
                    const obs = obstacles[i];
                    if (rectCollide(playerBounds, obs.getBounds())) {
                        if (shieldActive) {
                            // щит спасает
                            obstacles.splice(i,1);
                            shieldActive = false;
                            shieldTimer = 0;
                            // вспышка
                            canvas.style.boxShadow = '0 0 50px #00ff00';
                            setTimeout(()=>{ canvas.style.boxShadow = '0 0 30px #e94560'; }, 200);
                            continue;
                        }
                        gameOver();
                        return;
                    }
                }

                // Хорошие предметы
                for (let i = goodItems.length-1; i >= 0; i--) {
                    const item = goodItems[i];
                    if (rectCollide(playerBounds, item.getBounds())) {
                        score += 20;
                        updateScoreDisplay();
                        goodItems.splice(i,1);
                        // визуальная вспышка
                    }
                }
            }

            function rectCollide(r1, r2) {
                return r1.x < r2.x + r2.w &&
                       r1.x + r1.w > r2.x &&
                       r1.y < r2.y + r2.h &&
                       r1.y + r1.h > r2.y;
            }

            function gameOver() {
                isGameOver = true;
                dilemmaActive = false;
            }

            function activateDilemma() {
                if (dilemmas.length === 0) return;
                dilemmaActive = true;
                const randomIndex = Math.floor(Math.random() * dilemmas.length);
                dilemmaData = { ...dilemmas[randomIndex] };
                // Создаём кнопки для ответа (координаты будут рассчитаны при отрисовке)
                dilemmaButtons = [];
            }

            function resolveDilemma(choice) {
                if (!dilemmaActive || !dilemmaData) return;
                const result = choice === 'good' ? dilemmaData.good : dilemmaData.bad;
                score += result.points;
                if (score < 0) score = 0;
                updateScoreDisplay();

                if (result.shield) {
                    shieldActive = true;
                    shieldTimer = 180; // примерно 3 секунды при 60 fps
                }
                if (result.shake) {
                    // тряска canvas
                    canvas.style.transform = 'translate(5px, 3px)';
                    setTimeout(()=>{ canvas.style.transform = 'translate(0,0)'; }, 100);
                }

                dilemmaActive = false;
                dilemmaData = null;
                dilemmaButtons = [];
            }

            function updateScoreDisplay() {
                scoreSpan.textContent = score;
            }

            // ---------- ОТРИСОВКА ----------
            function drawBackground() {
                // Яркий градиентный фон
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#0f0c29');
                grad.addColorStop(0.5, '#302b63');
                grad.addColorStop(1, '#24243e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // линии дорожек
                ctx.strokeStyle = '#e94560';
                ctx.lineWidth = 2;
                for (let i = 1; i < LANE_COUNT; i++) {
                    const y = i * laneHeight;
                    ctx.beginPath();
                    ctx.setLineDash([15, 10]);
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
                ctx.setLineDash([]); // сброс
            }

            function drawPlayer() {
                ctx.save();
                ctx.shadowColor = '#00ffff';
                ctx.shadowBlur = 25;

                // Тело персонажа (эмодзи или простой рисунок)
                ctx.font = '50px Arial';
                ctx.fillStyle = '#fff';
                // Мигание щита
                if (shieldActive) {
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 40;
                    // обводка
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(playerX + playerWidth/2, playerY + playerHeight/2, 40, 0, Math.PI*2);
                    ctx.stroke();
                }

                // Сам персонаж: используем эмодзи человечка
                ctx.fillText('🏃', playerX-5, playerY+45);
                // можно добавить футболку с буквой
                ctx.restore();
            }

            function drawDilemmaPopup() {
                if (!dilemmaActive || !dilemmaData) return;

                // Затемнение
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Окно
                const boxWidth = canvas.width * 0.85;
                const boxHeight = 220;
                const boxX = (canvas.width - boxWidth) / 2;
                const boxY = (canvas.height - boxHeight) / 2;

                ctx.fillStyle = '#2d2d44';
                ctx.shadowColor = '#e94560';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 20);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                // Текст дилеммы
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                wrapText(ctx, dilemmaData.text, canvas.width/2, boxY + 40, boxWidth - 40, 20);

                // Кнопки
                const buttonWidth = boxWidth - 60;
                const buttonHeight = 45;
                const buttonX = boxX + 30;
                const goodY = boxY + 80;
                const badY = boxY + 135;

                // Сохраняем координаты кнопок для обработки касаний
                dilemmaButtons = [
                    { x: buttonX, y: goodY, w: buttonWidth, h: buttonHeight, choice: 'good' },
                    { x: buttonX, y: badY, w: buttonWidth, h: buttonHeight, choice: 'bad' }
                ];

                // Кнопка "хороший выбор"
                drawButton(ctx, buttonX, goodY, buttonWidth, buttonHeight, dilemmaData.good.label, '#4caf50');
                // Кнопка "плохой выбор"
                drawButton(ctx, buttonX, badY, buttonWidth, buttonHeight, dilemmaData.bad.label, '#f44336');
            }

            function drawButton(ctx, x, y, w, h, text, color) {
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, 10);
                ctx.fill();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x + w/2, y + h/2);
            }

            // Вспомогательная функция для переноса текста
            function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
                const words = text.split(' ');
                let line = '';
                let testLine;
                let lineY = y;
                for (let n = 0; n < words.length; n++) {
                    testLine = line + words[n] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && n > 0) {
                        ctx.fillText(line, x, lineY);
                        line = words[n] + ' ';
                        lineY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, x, lineY);
            }

            // ---------- ИГРОВОЙ ЦИКЛ ----------
            function gameLoop() {
                if (isGameOver) {
                    // Экран проигрыша
                    ctx.fillStyle = 'rgba(0,0,0,0.8)';
                    ctx.fillRect(0,0,canvas.width, canvas.height);
                    ctx.fillStyle = 'white';
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('ТЫ ВЫРВАЛСЯ!', canvas.width/2, canvas.height/2-40);
                    ctx.font = '18px Arial';
                    ctx.fillText('Рейтинг: '+score, canvas.width/2, canvas.height/2+20);
                    ctx.fillText('Нажми, чтобы начать заново', canvas.width/2, canvas.height/2+60);
                    return;
                }

                if (!dilemmaActive) {
                    // Движение мира
                    frameCount++;
                    if (frameCount % 60 === 0 && gameSpeed < 10) {
                        gameSpeed += 0.2; // плавное ускорение
                    }

                    // Спавн
                    spawnObjects();

                    // Обновление объектов
                    for (let obs of obstacles) obs.update();
                    for (let item of goodItems) item.update();

                    // Удаление ушедших за экран
                    obstacles = obstacles.filter(obs => obs.x + obs.width > 0);
                    goodItems = goodItems.filter(item => item.x + item.size > 0);

                    // Проверка коллизий
                    checkCollisions();

                    // Таймер щита
                    if (shieldActive) {
                        shieldTimer--;
                        if (shieldTimer <= 0) shieldActive = false;
                    }

                    // Случайная активация дилеммы (примерно раз в 15 секунд)
                    if (frameCount % 180 === 0 && Math.random() < 0.4) {
                        activateDilemma();
                    }
                }

                // Отрисовка
                drawBackground();
                for (let obs of obstacles) obs.draw(ctx);
                for (let item of goodItems) item.draw(ctx);
                drawPlayer();
                drawDilemmaPopup();

                requestAnimationFrame(gameLoop);
            }

            // ---------- УПРАВЛЕНИЕ ----------
            function handleTouchOrClick(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;   // масштаб canvas
                const scaleY = canvas.height / rect.height;

                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                // Координаты внутри canvas
                const canvasX = (clientX - rect.left) * scaleX;
                const canvasY = (clientY - rect.top) * scaleY;

                // Если активна дилемма — проверяем нажатие на кнопки
                if (dilemmaActive && dilemmaButtons.length === 2) {
                    for (let btn of dilemmaButtons) {
                        if (canvasX >= btn.x && canvasX <= btn.x + btn.w &&
                            canvasY >= btn.y && canvasY <= btn.y + btn.h) {
                            resolveDilemma(btn.choice);
                            return;
                        }
                    }
                    return; // если дилемма, то не переключаем дорожки
                }

                // Если игра окончена — рестарт
                if (isGameOver) {
                    initGame();
                    return;
                }

                // Переключение дорожек: верхняя треть, средняя, нижняя
                const laneFromY = Math.floor(canvasY / laneHeight);
                if (laneFromY >= 0 && laneFromY < LANE_COUNT) {
                    playerLane = laneFromY;
                    playerY = playerLane * laneHeight + (laneHeight - playerHeight) / 2;
                }
            }

            // Обработчики событий
            canvas.addEventListener('touchstart', handleTouchOrClick, {passive: false});
            canvas.addEventListener('mousedown', handleTouchOrClick);
            // Для десктопа также клавиши
            window.addEventListener('keydown', (e) => {
                if (dilemmaActive) {
                    if (e.key === '1' || e.key === 'ArrowLeft') resolveDilemma('good');
                    if (e.key === '2' || e.key === 'ArrowRight') resolveDilemma('bad');
                    return;
                }
                if (isGameOver) {
                    initGame();
                    return;
                }
                if (e.key === 'ArrowUp' || e.key === 'w') {
                    playerLane = Math.max(0, playerLane - 1);
                    playerY = playerLane * laneHeight + (laneHeight - playerHeight) / 2;
                } else if (e.key === 'ArrowDown' || e.key === 's') {
                    playerLane = Math.min(LANE_COUNT - 1, playerLane + 1);
                    playerY = playerLane * laneHeight + (laneHeight - playerHeight) / 2;
                }
            });

            // Поддержка круглых прямоугольников
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };

            // Запуск
            initGame();
            gameLoop();
        })();
    </script>
</body>
</html>
